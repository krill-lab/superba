<rect x="1263" y="574" width="31" height="32" rx="6" fill="#D8DFCD"/><path d="M1278 576V532" stroke="#7E9D80" stroke-width="3"/><path d="M1278 558Q1249 553 1256 534Q1278 535 1278 558M1279 548Q1304 545 1303 526Q1281 528 1279 548" fill="#8EAD8E"/>
