  <g class="working-arm"><path d="M46-17Q61 9 109 10" fill="none" stroke="#D85572" stroke-width="11" stroke-linecap="round"/></g>
  <g class="return-arm"><path d="M49-17Q74 11 63 34" fill="none" stroke="#D85572" stroke-width="11" stroke-linecap="round"/></g>
 </g>
 </g><g class="cargo"><g transform="translate(105 -27)"><use xlink:href="#crate"/></g><path d="M81 11Q92 22 111 20" fill="none" stroke="#FF8391" stroke-width="11" stroke-linecap="round"/></g>
</g></g>
<!-- A very comfortable second thread. -->
<ellipse cx="1127" cy="684" rx="127" ry="12" fill="#B7C6BC" opacity=".28"/>
<path d="M1052 627L1042 680M1180 625L1191 680" stroke="#80988D" stroke-width="10" stroke-linecap="round"/>
<path d="M1023 570Q1019 523 1064 521H1168Q1215 524 1212 568L1204 624Q1199 645 1176 645H1052Q1031 645 1028 623Z" fill="url(#chair)"/>
<path d="M1039 595Q1122 617 1195 594" fill="none" stroke="#AED3C3" stroke-width="4" opacity=".5"/>
<g transform="translate(1100 571)">
 <g stroke="#BA5569" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-7 29L-16 64L13 72"/><g class="idle-foot"><path d="M18 35L58 59L88 49"/></g></g>
 <g class="rest-body"><g transform="translate(-91 -165) scale(.225)"><use xlink:href="#shrimp"/></g>
  <!-- A relaxed eyelid and smile. -->
  <path d="M44-88Q60-98 75-87" fill="none" stroke="#293B43" stroke-width="4" stroke-linecap="round"/>
  <path d="M61-56Q72-48 81-57" fill="none" stroke="#A94458" stroke-width="3" stroke-linecap="round"/>
  <g class="sip"><path d="M52-12Q81 9 91-18" fill="none" stroke="#E76B82" stroke-width="11" stroke-linecap="round"/>
   <g transform="translate(101 -36)"><use xlink:href="#coffee"/><g stroke="#B6B4A8" stroke-width="3" stroke-linecap="round" fill="none"><path class="steam" d="M-10-15Q-20-26-10-37"/><path class="steam two" d="M3-15Q14-27 3-40"/><path class="steam three" d="M13-14Q4-25 13-36"/></g></g>
  </g>
 </g>
</g>
