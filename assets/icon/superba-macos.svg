<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
<title id="title">superba — Pearl (macOS)</title><desc id="desc">The superba.svg artwork on Apple's macOS app icon grid: an 824 px continuous-corner tile at 100,100 with its shadow inside the transparent margin.</desc>
<!-- macOS master for Superba.icns. Same artwork as superba.svg, scaled by 824/928 about the centre: the
     928 px tile at 48,48 becomes Apple's 824 px tile at 100,100. The tile is a continuous-corner rounded
     square (Apple's "squircle"; corner 185.4 = 0.225 x 824, cubic constants of the iOS/macOS continuous
     corner), not a circular rx. Windows and Linux keep superba.svg, which fills more of the canvas. -->
<defs>
<linearGradient id="base" x1="270.48" y1="100" x2="758.84" y2="924" gradientUnits="userSpaceOnUse"><stop offset="0.000" stop-color="#FFFFFF"/><stop offset="0.500" stop-color="#F4F6FA"/><stop offset="1.000" stop-color="#DFE6F0"/></linearGradient>
