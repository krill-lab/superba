# superba-config message catalog (English). Every key must also exist in
# zh-CN.toml (enforced by tests). Placeholders use {name}.

[config.note]
provider_base_url_missing = "The original provider table [model_providers.{provider}] has no base_url; openai_base_url is restored as it was."
sign_in_required = "No saved ChatGPT login: sign in again in ChatGPT after switching."
live_login_kept = "The ChatGPT login currently in auth.json is kept."
drift_kept = "Kept your own value of {key}."
profile_override = "config.toml selects profile \"{profile}\"; its settings may override the keys Superba writes."
credentials_store = "cli_auth_credentials_store = \"{store}\": Codex may read credentials from the OS keyring instead of auth.json."
openai_provider_table = "config.toml defines [model_providers.openai]; Codex may ignore or reject it. Superba never writes it."
legacy_provider_table = "The [model_providers.{provider}] table is kept unchanged."
signed_out = "You signed out of ChatGPT since the last switch; that saved login will not be restored."
stale_login = "This ChatGPT login was saved {days} days ago; you may need to sign in again after restoring it."
setting_shape_conflict = "Skipped {key}: config.toml has a different kind of value at or above it."
generation_catalog_missing = "The model catalog file {file} of generation {generation} no longer exists, so the restored config.toml does not name it (Codex could not start otherwise); its per-model settings are not restored."
auth_kept = "Kept auth.json: it was changed outside Superba after Superba wrote it."

[env.scope]
non_utf8_skipped = "Skipped {path}: it contains non-UTF-8 bytes; convert it to UTF-8 so Superba can scan and edit it. Other locations are still planned."
new_shells = "New terminal windows get the new value right away."
linux_session = "Apps started from the desktop menu see it after logging out and back in (systemd environment.d; some KDE / X11 sessions ignore it)."
restart_running = "Running IDEs and terminals keep the old value until restarted."
macos_launchd = "Apps opened from the Dock or Finder from now on get it immediately (launchctl); it is re-applied at every login."
windows_broadcast = "New Command Prompt / PowerShell windows opened from Explorer get the new value right away."
windows_wsl = "The ChatGPT app runs Codex inside WSL (\"Run Codex in WSL\"): WSLENV now forwards the variable there too; the app's Codex gets it after the app restarts."
windows_terminal = "Windows Terminal and VS Code must be fully restarted to see it."
kept_changed = "Left {location} as it is: its value was changed to {value} after Superba set it."

[config.harness]
nothing_owned = "Superba manages nothing in this harness's files: there is nothing to restore."
backup_restored = "The file is back as it was in that backup; Superba no longer manages anything in it."

[config.harness.dsh]
reload = "dsh reads its profile patches and .env when it starts (a running dsh web picks up patch changes, but not the key): restart dsh to use this."
plain_key = "The key is kept in plain text in $DSH_HOME/.env as {var} (file mode 0600)."
telemetry_off = "dsh's feedback upload (OpenTelemetry) and DeepSeek session-log upload are switched off in every profile."
home_patch = "$DSH_HOME/cordis.patch.yml has a {entry} entry: it replaces what Superba writes into the profiles."
env_var = "{var} is set in the environment: dsh uses it instead of the key in $DSH_HOME/.env."
credentials = "dsh's .credentials.yaml stores {var}: profiles that read it (web, desktop) use that value instead of the key in .env."

[config.harness.opencode]
v2_live = "OpenCode 2 picks this up at once (its background service reloads the file)."
v1_restart = "OpenCode 1 reads its configuration once: restart opencode to use this."
plain_key = "opencode keeps the key in plain text in its configuration file (file mode 0600)."
project_override = "An opencode.json in a project overrides these settings while you work in that project."
env_override = "{var} is set in Superba's environment: opencode loads it after the global file, so its model or provider may win."
managed = "Managed opencode settings in {path} override everything Superba writes."
both_files = "Both opencode.json and opencode.jsonc exist; Superba writes opencode.jsonc, which opencode reads last."

[config.harness.pi]
no_hot_reload = "pi reads models.json when it starts and when /model opens: running sessions keep the old provider until you pick the model again in /model."
plain_key = "pi keeps the key in plain text in models.json (file mode 0600)."
auth_override = "pi's auth.json holds a credential for the provider \"{id}\": it wins over the key Superba writes. Remove it with /logout in pi."

[config.harness.workbuddy]
hot_reload = "WorkBuddy reloads models.json within seconds."
login = "WorkBuddy shows custom models only after you sign in with a Tencent CodeBuddy / WorkBuddy account, and it sends each custom model's domain to Tencent."
plain_key = "WorkBuddy keeps the key in plain text in models.json (file mode 0600)."

[config.harness.zcode]
hot_reload = "ZCode shows the change within about 8 seconds; a session that is already open keeps its model."
plain_key = "ZCode keeps the key in plain text in provider_config.json (file mode 0600)."
legacy = "ZCode's legacy v2/config.json exists; ZCode imported it once and now uses provider_config.json, which is what Superba writes."

[config.settings]
partial_support = "{key} has no effect for {consumers}; it is written for the others."
no_catalog = "No settings catalog is available; settings for {consumer} are not checked."
catalog_approximate = "The settings catalog has no entry for {consumer}; Codex {catalog} is used instead."
catalog_outdated = "{consumer} is newer than the settings catalog (Codex {catalog}); newer keys are not checked."
catalog_below_floor = "{consumer} is older than the settings catalog (from Codex {catalog}); keys are not checked."
version_unknown = "The Codex version of {consumer} is unknown; settings are written without a version check."

# The file editor's checks and formatting (GitHub issue 9). Messages never
# quote a value of the file.
[codex_files]
claude_not_object = "settings.json must be a JSON object."
claude_env_not_text = "{field}: environment variables are text; Claude Code reads this value as \"{value}\"."
toml_syntax = "TOML syntax error: {message}"
json_syntax = "JSON syntax error: {detail}"
json_eof = "the file ends too early"
json_detail = "{detail}"
unknown_key = "{path} is not a setting of {codex}: Codex ignores it (check the spelling)."
not_in_version = "{codex} does not know {path}: it ignores it."
deprecated = "{path} is deprecated in {codex}."
removed = "{path} has no effect any more in {codex}."
legacy_named = "{path} is an old name: use {canonical}."
legacy = "{path} is an old name Codex still reads."
wrong_type = "{path}: expected {expected}."
wrong_type_for = "{path}: {codex} expects {expected}."
auth_empty = "auth.json is empty: Codex would ask you to sign in again. Write a JSON object, or restore a backup."
auth_not_object = "auth.json must be a JSON object."
auth_wrong_type = "{field}: expected {expected}, found {found}."
auth_unknown_field = "Codex does not read {field}."
secret_partly_changed = "The hidden value of {field} was changed only partly. Show the secrets to edit it, or undo the change."
auth_bad_time = "last_refresh is not a date and time like 2026-10-18T09:30:00Z."
auth_no_credential = "auth.json holds no credential (no API key, PAT or ChatGPT login): Codex will ask you to sign in."
auth_tokens_missing = "tokens has no {field}: the ChatGPT login may not work."
format_changed = "Formatting would change what the file means; it was left as it is."
format_failed = "The file could not be formatted."

[config.claude]
new_sessions = "New Claude Code sessions use this; running sessions keep what they started with."
restored = "Claude Code's settings are back to what they were before Superba (keys changed by someone else since were kept)."

[config.harness.gemini]
restart = "Restart Gemini CLI to load its user settings and .env. Project settings and shell environment variables can override them."
