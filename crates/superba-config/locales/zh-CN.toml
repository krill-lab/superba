# superba-config 消息目录（简体中文）。键必须与 en.toml 一致（测试强制）。

[config.note]
provider_base_url_missing = "原 provider 表 [model_providers.{provider}] 没有 base_url，openai_base_url 按原样还原。"
sign_in_required = "没有保存的 ChatGPT 登录：切换后请在 ChatGPT 里重新登录。"
live_login_kept = "保留 auth.json 里当前的 ChatGPT 登录。"
drift_kept = "已保留你自己设置的 {key}。"
profile_override = "config.toml 选择了 profile \"{profile}\"，其中的设置可能覆盖 Superba 写入的键。"
credentials_store = "cli_auth_credentials_store = \"{store}\"：Codex 可能从系统钥匙串而不是 auth.json 读取凭据。"
openai_provider_table = "config.toml 定义了 [model_providers.openai]，Codex 可能忽略或拒绝它。Superba 从不写入这个表。"
legacy_provider_table = "[model_providers.{provider}] 表保持不变。"
signed_out = "上次切换后你在 ChatGPT 里退出了登录，不会再还原那份保存的登录。"
stale_login = "这份 ChatGPT 登录已保存 {days} 天，还原后可能需要重新登录。"
setting_shape_conflict = "已跳过 {key}：config.toml 在这个位置或其上级有不同类型的值。"
generation_catalog_missing = "第 {generation} 代配置使用的模型目录文件 {file} 已不存在，还原后的 config.toml 不再引用它（否则 Codex 无法启动）；那时的单模型设置不会还原。"

[env.scope]
non_utf8_skipped = "已跳过 {path}：该文件包含非 UTF-8 字节；请将其转换为 UTF-8，以便 Superba 扫描和编辑。其他位置仍会正常规划。"
new_shells = "新开的终端窗口立即生效。"
linux_session = "从桌面菜单启动的程序需要注销并重新登录后才生效（systemd environment.d；部分 KDE / X11 会话不读取它）。"
restart_running = "正在运行的 IDE 和终端要重启后才会用新值。"
macos_launchd = "之后从 Dock 或访达打开的程序立即生效（launchctl），每次登录时会自动重设。"
windows_broadcast = "之后从资源管理器打开的命令提示符 / PowerShell 立即生效。"
windows_terminal = "Windows Terminal 和 VS Code 需要完全重启才能看到新值。"

[config.settings]
partial_support = "{key} 对 {consumers} 无效；仍会为其他 Codex 写入。"
no_catalog = "没有可用的设置目录，不检查 {consumer} 的设置项。"
catalog_approximate = "设置目录中没有 {consumer} 的条目，改用 Codex {catalog} 的数据。"
catalog_outdated = "{consumer} 比设置目录（Codex {catalog}）更新，不检查新增的设置项。"
catalog_below_floor = "{consumer} 早于设置目录覆盖的最低版本（Codex {catalog}），不检查设置项。"
version_unknown = "{consumer} 的 Codex 版本未知，写入设置时不做版本检查。"
