# superba-config 消息目录（简体中文）。键必须与 en.toml 一致（测试强制）。

[config.note]
provider_base_url_missing = "原 provider 表 [model_providers.{provider}] 没有 base_url，openai_base_url 按原样还原。"
sign_in_required = "没有保存的 ChatGPT 登录：切换后请在 ChatGPT 里重新登录。"
live_login_kept = "保留 auth.json 里当前的 ChatGPT 登录。"
drift_kept = "已保留你自己设置的 {key}。"
profile_override = "config.toml 选择了 profile \"{profile}\"，其中的设置可能覆盖 Superba 写入的键。"
credentials_store = "cli_auth_credentials_store = \"{store}\"：Codex 可能从系统钥匙串而不是 auth.json 读取凭据。"
openai_provider_table = "config.toml 定义了 [model_providers.openai]，Codex 可能忽略或拒绝它。Superba 从不写入这个表。"
legacy_provider_table = "[model_providers.{provider}] 表保持不变。"
signed_out = "上次切换后你在 ChatGPT 里退出了登录，不会再还原那份保存的登录。"
stale_login = "这份 ChatGPT 登录已保存 {days} 天，还原后可能需要重新登录。"
setting_shape_conflict = "已跳过 {key}：config.toml 在这个位置或其上级有不同类型的值。"
generation_catalog_missing = "第 {generation} 代配置使用的模型目录文件 {file} 已不存在，还原后的 config.toml 不再引用它（否则 Codex 无法启动）；那时的单模型设置不会还原。"
auth_kept = "已保留 auth.json：它在 Superba 写入之后被 Superba 以外的程序修改过。"

[env.scope]
non_utf8_skipped = "已跳过 {path}：该文件包含非 UTF-8 字节；请将其转换为 UTF-8，以便 Superba 扫描和编辑。其他位置仍会正常规划。"
new_shells = "新开的终端窗口立即生效。"
linux_session = "从桌面菜单启动的程序需要注销并重新登录后才生效（systemd environment.d；部分 KDE / X11 会话不读取它）。"
restart_running = "正在运行的 IDE 和终端要重启后才会用新值。"
macos_launchd = "之后从 Dock 或访达打开的程序立即生效（launchctl），每次登录时会自动重设。"
windows_broadcast = "之后从资源管理器打开的命令提示符 / PowerShell 立即生效。"
windows_wsl = "ChatGPT app 在 WSL 中运行 Codex（“在 WSL 中运行 Codex”）：WSLENV 现在也会把该变量转给 WSL；app 重启后其中的 Codex 才能读到。"
windows_terminal = "Windows Terminal 和 VS Code 需要完全重启才能看到新值。"
kept_changed = "{location} 保持不变：Superba 设置之后它的值被改成了 {value}。"

[config.harness]
nothing_owned = "Superba 没有管理这个 harness 文件里的任何条目，无需恢复。"
backup_restored = "文件已恢复为该备份时的样子；Superba 不再管理其中的任何内容。"

[config.harness.dsh]
reload = "dsh 在启动时读取各配置档的补丁和 .env（正在运行的 dsh web 会读到补丁的变化，但读不到密钥）：重启 dsh 后生效。"
plain_key = "密钥以明文保存在 $DSH_HOME/.env 的 {var} 中（文件权限 0600）。"
telemetry_off = "已在每个配置档中关闭 dsh 的反馈上传（OpenTelemetry）和 DeepSeek 会话日志上传。"
home_patch = "$DSH_HOME/cordis.patch.yml 里有 {entry} 条目：它会覆盖 Superba 写入各配置档的内容。"
env_var = "环境变量里设置了 {var}：dsh 会用它，而不是 $DSH_HOME/.env 里的密钥。"
credentials = "dsh 的 .credentials.yaml 保存了 {var}：读取它的配置档（web、desktop）会用那个值，而不是 .env 里的密钥。"

[config.harness.opencode]
v2_live = "OpenCode 2 会立即生效（它的后台服务会重新读取文件）。"
v1_restart = "OpenCode 1 只在启动时读取配置：重启 opencode 后生效。"
plain_key = "opencode 以明文在配置文件中保存密钥（文件权限 0600）。"
project_override = "项目里的 opencode.json 会在该项目中覆盖这些设置。"
env_override = "Superba 的环境里设置了 {var}：opencode 会在全局文件之后读取它，其中的模型或供应商可能优先。"
managed = "{path} 中的 opencode 托管设置会覆盖 Superba 写入的全部内容。"
both_files = "opencode.json 和 opencode.jsonc 同时存在；Superba 写入 opencode.jsonc，opencode 最后读取它。"

[config.harness.pi]
no_hot_reload = "pi 在启动和打开 /model 时读取 models.json：正在运行的会话会继续用旧的供应商，直到在 /model 中重新选择模型。"
plain_key = "pi 以明文在 models.json 中保存密钥（文件权限 0600）。"
auth_override = "pi 的 auth.json 里有供应商 \"{id}\" 的凭据：它优先于 Superba 写入的密钥。请在 pi 中用 /logout 删除。"

[config.harness.workbuddy]
hot_reload = "WorkBuddy 会在几秒内重新读取 models.json。"
login = "WorkBuddy 只有在登录腾讯 CodeBuddy / WorkBuddy 账号后才显示自定义模型，并会把每个自定义模型的域名发送给腾讯。"
plain_key = "WorkBuddy 以明文在 models.json 中保存密钥（文件权限 0600）。"

[config.harness.zcode]
hot_reload = "ZCode 约 8 秒内显示这些变化；已经打开的会话继续用原来的模型。"
plain_key = "ZCode 以明文在 provider_config.json 中保存密钥（文件权限 0600）。"
legacy = "存在 ZCode 旧的 v2/config.json；ZCode 已导入过一次，现在使用 Superba 写入的 provider_config.json。"

[config.settings]
partial_support = "{key} 对 {consumers} 无效；仍会为其他 Codex 写入。"
no_catalog = "没有可用的设置目录，不检查 {consumer} 的设置项。"
catalog_approximate = "设置目录中没有 {consumer} 的条目，改用 Codex {catalog} 的数据。"
catalog_outdated = "{consumer} 比设置目录（Codex {catalog}）更新，不检查新增的设置项。"
catalog_below_floor = "{consumer} 早于设置目录覆盖的最低版本（Codex {catalog}），不检查设置项。"
version_unknown = "{consumer} 的 Codex 版本未知，写入设置时不做版本检查。"

# 文件编辑器的检查与格式化（GitHub issue 9）。消息从不引用文件里的值。
[codex_files]
claude_not_object = "settings.json 必须是一个 JSON 对象。"
claude_env_not_text = "{field}：环境变量都是文本，Claude Code 会把这个值读成 \"{value}\"。"
toml_syntax = "TOML 语法错误：{message}"
json_syntax = "JSON 语法错误：{detail}"
json_eof = "文件提前结束了"
json_detail = "{detail}"
unknown_key = "{path} 不是 {codex} 的设置项：Codex 会忽略它（请检查拼写）。"
not_in_version = "{codex} 不认识 {path}：会忽略它。"
deprecated = "{path} 在 {codex} 中已弃用。"
removed = "{path} 在 {codex} 中已不再起作用。"
legacy_named = "{path} 是旧名称：请改用 {canonical}。"
legacy = "{path} 是 Codex 仍能读取的旧名称。"
wrong_type = "{path}：应为 {expected}。"
wrong_type_for = "{path}：{codex} 要求 {expected}。"
auth_empty = "auth.json 是空的：Codex 会要求你重新登录。请写入一个 JSON 对象，或还原一份备份。"
auth_not_object = "auth.json 必须是一个 JSON 对象。"
auth_wrong_type = "{field}：应为 {expected}，实际是 {found}。"
auth_unknown_field = "Codex 不读取 {field}。"
secret_partly_changed = "{field} 的隐藏值只被改了一部分。请先显示密钥再编辑，或撤销这次修改。"
auth_bad_time = "last_refresh 不是形如 2026-10-18T09:30:00Z 的日期时间。"
auth_no_credential = "auth.json 里没有凭据（没有 API key、PAT 或 ChatGPT 登录）：Codex 会要求你登录。"
auth_tokens_missing = "tokens 里没有 {field}：ChatGPT 登录可能无法使用。"
format_changed = "格式化会改变文件的含义，因此保持原样未改动。"
format_failed = "无法格式化这个文件。"

[config.claude]
nothing_owned = "Superba 没有管理 settings.json 里的任何键，无需还原。"
new_sessions = "新开的 Claude Code 会话生效；正在运行的会话保持启动时的设置。"
restored = "Claude Code 的设置已还原为 Superba 之前的样子（之后被别人改过的键保持不变）。"
