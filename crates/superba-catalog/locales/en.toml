# UI strings of superba-catalog (catalog.*). Layer onto the binary's catalog with
# superba_catalog::i18n_source(locale).

[catalog.match]
nearest = "Settings for Codex {installed} come from the catalog of Codex {used}."
newer = "Codex {installed} is newer than the settings catalog (latest: {used}); settings added since then are not listed."
older = "Codex {installed} is older than the settings catalog; showing Codex {used}, so some settings may not apply."

