tip = "Codex compacts long conversations by asking the provider (a compaction_trigger request) and keeps the provider's encrypted compaction item; only that provider can read it."
tip_check = "Last check {when} with {model}: {result}"
unsupported_note = "This provider cannot compact Codex conversations. Codex has no setting that makes the provider Superba configures compact locally, so when a conversation fills its context window its compaction fails here: start a new conversation then, or use router mode together with a provider that compacts (the router sends compaction there and keeps the conversation with it)."

