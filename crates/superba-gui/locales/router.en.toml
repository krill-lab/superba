[usage.banner]
on = "Router on ({addr}): requests through it show first token, TPS, line and transport; the rest come from Codex's session files."
on_tip = "Requests the local router recorded are listed once, with its timing and line. Requests that did not go through it (earlier ones, or while it was paused) are read from Codex's session files on this computer: model, tokens, cost and duration, no first token, TPS, line or transport."
off = "Router off: requests come from Codex's session files on this computer (first token, TPS, line and transport only through the local router)."
off_tip = "Codex writes every model request's usage into its session files (CODEX_HOME/sessions). Superba reads them read-only: model, input, output, cache, cost and duration. Turn on the local router for first token, TPS, the line that answered, transport and HTTP status."
settings = "Open Router"

