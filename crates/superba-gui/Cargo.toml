[package]
name = "superba-gui"
description = "Superba desktop GUI (egui/eframe, Geist look); the superba binary also accepts spb subcommands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true
# Geist Sans / Geist Mono are bundled under assets/fonts (SIL Open Font License 1.1,
# see assets/fonts/LICENSE-Geist-OFL.txt).
include = ["src/**", "assets/**", "locales/**", "tests/**", "Cargo.toml"]

[lib]
name = "superba_gui"
path = "src/lib.rs"

[[bin]]
name = "superba"
path = "src/main.rs"

[features]
default = []
# Native file dialogs (identity files, custom site import).
file-dialogs = ["dep:rfd"]

[dependencies]
superba-core.workspace = true
superba-cli.workspace = true
superba-switch.workspace = true
superba-catalog.workspace = true
superba-models.workspace = true
superba-router.workspace = true
superba-versions.workspace = true
anyhow.workspace = true
egui.workspace = true
fontdb.workspace = true
open.workspace = true
resvg.workspace = true
roxmltree.workspace = true
serde_json.workspace = true
toml.workspace = true
rfd = { workspace = true, optional = true }
sys-locale.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
# the token of the single-window handover (src/instance.rs)
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Renderer: OpenGL (glow) on Linux and macOS (Linux CI and the screenshots run on
# Xvfb + Mesa llvmpipe).
[target.'cfg(not(windows))'.dependencies]
eframe = { workspace = true, features = ["glow"] }

# Renderer: wgpu with Direct3D 12 on Windows. Machines without a 3D driver (VMs,
# some RDP setups) only have Windows' OpenGL 1.1, which glow cannot use; Direct3D 12
# falls back to the WARP software rasterizer that every Windows 10/11 has (user bug 43).
[target.'cfg(windows)'.dependencies]
eframe = { workspace = true, features = ["wgpu_no_default_features"] }
windows-sys.workspace = true
wgpu.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
superba-import.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true

[build-dependencies]
winresource.workspace = true

[lints]
workspace = true
