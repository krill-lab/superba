# superba-sessions message catalog (English). Keys are flattened with ".".
# Every key here must also exist in zh-CN.toml (enforced by tests).

[sessions.warn]
unreadable = "Could not read {path}: {error}"
symlink_skipped = "Skipped the symbolic link {path}; session files must be regular files."
no_session_meta = "{count} session files have no session metadata and were left alone."
db_unreadable = "Could not read the database {path}: {error}"
db_on_share = "Skipped the database {path}: SQLite cannot lock files on network or WSL shares."
sqlite_home_unresolved = "Could not use sqlite_home = \"{value}\" from config.toml."
session_index_provider = "session_index.jsonl contains provider information; Superba leaves it unchanged."
stale_foreign_lock = "Ignored an old lock left by another tool: {path}"
