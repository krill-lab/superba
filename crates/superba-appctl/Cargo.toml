[package]
name = "superba-appctl"
description = "Superba desktop app control: install detection, launch with CDP, restart bridge, processes, turn activity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
superba-core.workspace = true
async-trait.workspace = true
futures-util.workspace = true
hex.workspace = true
# app.asar scan for the app-server version floor
memchr.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# `codex debug models` cache key (binary sha256)
sha2.workspace = true
sysinfo.workspace = true
# private empty CODEX_HOME for `codex debug models`
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
walkdir.workspace = true
which.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The router's handle-isolating spawn (service::detach) for the directly
# started desktop app.
superba-router.workspace = true
windows.workspace = true
windows-sys.workspace = true
winreg.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSRunningApplication", "libc"] }
objc2-foundation.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
