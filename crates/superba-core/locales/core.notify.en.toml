# superba-core messages about notifications (GitHub issue 12): channel kinds and
# fields, event names, skip reasons and the text of the messages Superba sends.
# Concatenated after en.toml into the core catalog, so this file must start with
# a table header and must not repeat a key of another core file (enforced by
# tests). Every key must also exist in core.notify.zh-CN.toml.

