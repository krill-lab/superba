# superba-core messages of the versions area (Codex installs, compatibility with
# the desktop app, app updates). Concatenated after en.toml into the core
# catalog, so this file must start with a table header and must not repeat a key
# of another core file (enforced by tests). Every key must also exist in
# core.versions.zh-CN.toml.

[install_kind]
standalone = "Standalone"
npm = "npm"
homebrew = "Homebrew"
app_bundled = "Bundled with the app"
superba_store = "Managed by Superba"
other = "Other"

[compat_tier]
same = "Same as the app"
compatible = "Compatible"
older = "Older: basic chat works, newer features may be missing"
below_floor = "Below the app's minimum version"
newer = "Much newer than the app's own Codex (untested)"

[app_source]
official = "OpenAI download server (persistent.oaistatic.com)"
store_mirror = "Microsoft Store CDN, link resolved by store.rg-adguard.net (third-party)"

# The desktop app version: the release version, with the MSIX package version
# labeled when there is one (AppInstall::version_text).
[app_version]
release = "{version}"
with_package = "{version} (package {package})"
package = "package {package}"

# A desktop app location the user picked (AppLocationCheck::text).
[app_location]
found = "ChatGPT {app} with Codex {codex} in {path}"
no_codex = "ChatGPT {app} in {path}, but its bundled Codex is missing: reinstall or update the app"
missing = "{path} does not exist"
not_app = "{path} is not the ChatGPT desktop app (no resources/app.asar): choose the app's install folder or its program file"
store_package = "{path} is inside the Microsoft Store ChatGPT app ({family}). Superba finds the Store app by itself, and this folder changes with every app update, so no location is needed: clear the location (and remove SUPERBA_APP_PATH if you set it)"
unknown = "unknown"
version = "{version}"
