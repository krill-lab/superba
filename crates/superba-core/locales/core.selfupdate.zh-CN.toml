# Superba 自身更新的核心文案（手动安装步骤）。与其他区域文件一起拼接成核心目录；
# 每个键都必须同时存在于 core.selfupdate.en.toml。

[selfupdate.manual]
package = "更新包已下载并校验通过：{path}"
macos = "退出 Superba，解压更新包，把 Superba.app 拖进 {dir}，替换旧版本。"
windows = "退出 Superba，运行安装程序 {path}。"
linux = "退出 Superba，把压缩包解压覆盖到 {dir}（目录属于 root 时用 sudo）：tar -xzf {path} --strip-components=1 -C {dir}"

[selfupdate.problem]
failed = "更新到 {version} 失败。"
not_applied = "安装程序报告成功，但当前仍是 Superba {current}。"
unfinished = "更新到 {version} 没有完成。"
error = "{detail}"
wait_timeout = "Superba 未能在 {secs} 秒内退出，所以没有安装 {version}。"
msiexec_start = "无法启动安装程序（msiexec）：{error}"
msiexec = "安装程序（msiexec）以代码 {code} 结束：{meaning}"
restart_pending = "更新已安装，需要重启 Windows 才能完成。"
router = "更新已安装，但本地路由未能重新启动（{detail}）。请在「路由」页重新启动它。"

[selfupdate.msiexec]
c0 = "成功"
c1641 = "成功；Windows Installer 已开始重启 Windows"
c3010 = "成功；需要重启 Windows 才能完成更新"
c1601 = "无法访问 Windows Installer 服务"
c1602 = "安装已被取消"
c1603 = "安装过程中发生严重错误"
c1612 = "安装源不可用"
c1618 = "另一个安装正在进行"
c1619 = "无法打开安装包"
c1620 = "安装包无效"
c1625 = "系统策略禁止此安装"
c1633 = "此平台不支持该安装包"
c1638 = "已安装此产品的另一个版本"
c1639 = "命令行参数无效"
unknown = "未知错误"
