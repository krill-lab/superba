# superba-core 请求记录相关文案（经路由的请求、状态、客户端）。拼接在 zh-CN.toml
# 之后组成 core 文案，所以本文件必须以表头开头，且不能重复其他 core 文件中的键
# （由测试保证）。每个键都必须在 core.requests.en.toml 中存在。

[request_client]
desktop = "桌面 app"
tui = "终端"
exec = "codex exec"
other = "其他"

# 请求记录的来源（用量页、CSV、spb usage）。
[request_source]
router = "本地路由"
claude_transcript = "Claude Code 会话记录"
rollout = "Codex 会话记录"
ccs = "从 CC Switch 导入"
ai_toolbox = "从 AI Toolbox 导入"

[request_status]
ok = "完成"
http = "HTTP {status} {code}"
failed = "失败 {code}"
incomplete = "未完成 {reason}"
broken = "中断"
cancelled = "取消"

# 默认回复统计行的各个片段（路由 → 统计行）。占位符由本地路由填写，请保持不变。
[stats_template]
tps = "{tps} tok/s"
ttft = "首字 {ttft}"
turn_tokens = "本轮 {input} in / {output} out"
cached = "缓存 {cached}"
cost = "≈ {cost}"
requests = "{requests} 次请求"
separator = " · "

# 请求体以何种方式发往上游（请求详情、CSV、spb）。
[request_compression]
none = "未压缩"
client_zstd = "zstd（Codex 已压缩）"
router_zstd = "zstd（路由器压缩）"
zstd_refused = "未压缩（上游拒绝 zstd，已重发）"

# 线路的传输方式检查（供应商 → 连接、spb）。
[transport_support]
supported = "支持"
unsupported = "不支持"
unknown = "未知"

# The Codex host of a request that is not this computer (user bug 45).
[request_host]
client_on_host = "{client} · {host}"

# 发出请求的工具（用量页、请求详情、spb usage）。
[request_harness]
gemini = "Gemini"
codex = "Codex"
claude_code = "Claude Code"
dsh = "dsh"
opencode = "opencode"
pi = "pi"
zcode = "ZCode"
workbuddy = "WorkBuddy"
unknown = "其他工具"

# 请求的 API 协议（工具使用的协议、发往上游的协议）。
[request_protocol]
gemini = "Gemini"
responses = "Responses API"
chat_completions = "Chat Completions"
messages = "Anthropic Messages"

# 会话中发出请求的代理。
[agent_kind]
main = "主对话"
subagent = "子代理"
background = "后台任务"

