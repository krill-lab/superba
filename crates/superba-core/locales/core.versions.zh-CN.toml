# superba-core 版本相关文案（Codex 安装方式、与桌面 app 的兼容性、app 更新）。
# 拼接在 zh-CN.toml 之后组成 core 文案，所以本文件必须以表头开头，且不能重复其他
# core 文件中的键（由测试保证）。每个键都必须在 core.versions.en.toml 中存在。

[install_kind]
standalone = "独立安装"
npm = "npm"
homebrew = "Homebrew"
app_bundled = "app 自带"
superba_store = "由 Superba 管理"
other = "其他"

[compat_tier]
same = "与 app 相同"
compatible = "兼容"
older = "较旧：基本对话可用，可能缺少新功能"
below_floor = "低于 app 要求的最低版本"
newer = "比 app 自带的 Codex 新很多（未经测试）"

[app_source]
official = "OpenAI 官方下载服务器（persistent.oaistatic.com）"
store_mirror = "Microsoft Store CDN，链接由第三方 store.rg-adguard.net 解析"

[app_version]
release = "{version}"
with_package = "{version}（包 {package}）"
package = "包 {package}"

[app_location]
found = "ChatGPT {app}，自带 Codex {codex}，位于 {path}"
no_codex = "在 {path} 找到 ChatGPT {app}，但缺少它自带的 Codex：请重新安装或更新 ChatGPT"
missing = "{path} 不存在"
not_app = "{path} 不是 ChatGPT 桌面 app（没有 resources/app.asar）：请选择 app 的安装文件夹或它的程序文件"
store_package = "{path} 位于微软商店版 ChatGPT 的应用包里（{family}）。Superba 会自动找到商店版 ChatGPT，而且这个文件夹每次 app 更新都会变，所以不需要设置位置：请清除位置（如果设置过 SUPERBA_APP_PATH 环境变量，也请删除它）"
unknown = "未知"
version = "{version}"
