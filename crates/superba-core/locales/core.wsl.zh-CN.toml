# superba-core 中关于 WSL 发行版的文案（用户问题 45）。拼接在 zh-CN.toml 之后组成
# core 文案，所以本文件必须以表头开头，且不能重复其他 core 文件中的键（由测试保证）。
# 每个键都必须在 core.wsl.en.toml 中存在。

[wsl]
version = "WSL {version}"
version_unknown = "WSL"
default = "默认发行版"
networking_nat = "NAT 网络"
networking_mirrored = "镜像网络"
networking_none = "无网络"
networking_virtio_proxy = "virtio 代理网络"

[wsl.progress]
warmup = "正在启动{host}（第 {attempt}/2 次尝试）…"
login = "正在读取{host}的登录环境（第 {attempt}/2 次尝试）…"
version = "正在检查{host}的 Codex 版本（第 {attempt}/2 次尝试）…"
files = "正在读取{host}的配置（第 {attempt}/2 次尝试）…"
system = "正在检查{host}的进程（第 {attempt}/2 次尝试）…"
write = "正在写入{host}的配置…"
command = "正在{host}上执行命令（第 {attempt}/2 次尝试）…"
