name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      msi_only:
        description: Run only the Windows MSI package test (no tag needed)
        type: boolean
        default: false
      dmg_only:
        description: Run only the macOS DMG package test (no tag needed)
        type: boolean
        default: false

# Third-party actions are pinned to full commit SHAs (version in a comment).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Hosted runners have ~14 GB free; full debug info for the whole workspace
  # (eframe, rusqlite, tokio, ...) does not fit next to the test binaries.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    if: ${{ !inputs.msi_only && !inputs.dmg_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.98 --profile minimal --component rustfmt
          rustup default 1.98
      - run: cargo fmt --all -- --check

  clippy:
    if: ${{ !inputs.msi_only && !inputs.dmg_only }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.98 --profile minimal --component clippy
          rustup default 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-clippy
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev pkg-config
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    if: ${{ !inputs.msi_only && !inputs.dmg_only }}
    runs-on: ${{ matrix.os }}
    # Blocking on all three systems: a test that fails only on macOS or Windows
    # fails the workflow like one on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.98 --profile minimal
          rustup default 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-test
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev pkg-config
      - name: Test the workspace
        env:
          SUPERBA_SECRET_BACKEND: file
          RUST_BACKTRACE: "1"
        # --no-fail-fast: report every failing test binary, not only the first.
        run: cargo test --workspace --locked --no-fail-fast

  spb-headless:
    if: ${{ !inputs.msi_only && !inputs.dmg_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.98 --profile minimal
          rustup default 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ci-spb-headless
      # Deliberately install no GUI development packages in this job: spb and
      # the router ship without the GUI (headless servers, the musl archive).
      - run: cargo build -p superba-cli -p superba-router --locked

  # The release's musl build, exactly: scripts/release/build-musl.sh on the
  # release's runner image (static spb + superba-router for the headless
  # archive; spb as the MSI's WSL helper, user bug 54(d)). Every run, so a
  # change that breaks the static build fails here and not at a release tag;
  # msi-package packages its helper. (Skipped by dmg_only.)
  musl:
    if: ${{ !inputs.dmg_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust and musl
        run: |
          rustup toolchain install 1.98 --profile minimal
          rustup default 1.98
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: musl
      - name: Build the static musl binaries (as the release does)
        run: scripts/release/build-musl.sh --helper-out wsl-helper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wsl-helper
          path: wsl-helper/*
          if-no-files-found: error
          retention-days: 3

  # Builds the Windows MSI and exercises it per-user: install, files, spb --version,
  # PATH, Add/Remove Programs, upgrade, uninstall. Manual runs only:
  #   gh workflow run ci.yml --ref <branch> -f msi_only=true
  msi-package:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dmg_only }}
    needs: musl
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install WiX
        shell: pwsh
        # WiX 5.0.2 + its UI and Util extensions (pinned hashes), tool folder on the PATH.
        run: ./scripts/release/install-wix.ps1
      - name: WiX smoke build (placeholder files; fails fast on a broken installer definition)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path smoke | Out-Null
          foreach ($f in 'superba.exe','spb.exe','superba-router.exe','superba_msi_ca.dll','LICENSE-MIT','LICENSE-APACHE','THIRD-PARTY-NOTICES.txt','LICENSE-Geist-OFL.txt') {
            'x' | Set-Content "smoke/$f"
          }
          # The WSL helper: an x86-64 ELF64 header is enough for the smoke build.
          $elf = New-Object byte[] 64
          $elf[0] = 0x7F; $elf[1] = 0x45; $elf[2] = 0x4C; $elf[3] = 0x46; $elf[4] = 2; $elf[18] = 0x3E
          [IO.File]::WriteAllBytes((Join-Path (Resolve-Path smoke) 'spb-linux-x86_64'), $elf)
          ./scripts/release/build-msi.ps1 -StageDir smoke -Version 0.1.0-alpha.1 -Out "$env:RUNNER_TEMP/smoke.msi"
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.98 --profile minimal
          rustup default 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package-test-msi
          cache-on-failure: true
      - name: Build the Windows programs
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        # (+ superba_msi_ca.dll, the installer's folder check embedded in the MSI)
        run: cargo build --release --locked -p superba-gui -p superba-cli -p superba-router -p superba-msi-ca
      # A clean Windows has no VC++ runtime: the programs must not import it (user bug 43).
      - name: Check the programs need no C runtime DLL
        shell: pwsh
        run: ./scripts/release/check-imports.ps1 target/release/superba.exe target/release/spb.exe target/release/superba-router.exe target/release/superba_msi_ca.dll
      - name: Stage the release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path stage | Out-Null
          foreach ($b in 'superba','spb','superba-router') { Copy-Item "target/release/$b.exe" stage }
          Copy-Item target/release/superba_msi_ca.dll stage
          Copy-Item LICENSE-MIT, LICENSE-APACHE, crates/superba-gui/assets/fonts/LICENSE-Geist-OFL.txt stage
          # The real notices come from cargo-about in the release workflow.
          'Third-party notices placeholder for the package test.' | Set-Content stage/THIRD-PARTY-NOTICES.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-helper
          path: stage
      - name: Install, upgrade and uninstall the MSI
        shell: pwsh
        env:
          SUPERBA_SECRET_BACKEND: file
        run: ./scripts/release/test-msi.ps1 -StageDir stage
      - name: Keep the MSI and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msi-test
          path: ${{ runner.temp }}/msi-test/*
          if-no-files-found: ignore
          retention-days: 3

  # Builds the macOS disk image as the release does (user bug 84; an Apple silicon
  # build, ad-hoc signed instead of Developer ID + notarization): the layout with
  # dmgbuild, then the files with hdiutil and ditto, read back with `macos-dmg.sh
  # inspect`. Then opens its window in Finder and takes screenshots in light and dark
  # appearance, here (macOS 14, as the release) and in dmg-finder (macOS 15, 26).
  # Manual runs only:
  #   gh workflow run ci.yml --ref <branch> -f dmg_only=true
  dmg-package:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.msi_only }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.98 --profile minimal
          rustup default 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package-test-dmg
          cache-on-failure: true
      - name: Build the macOS programs
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        run: cargo build --release --locked -p superba-gui -p superba-cli -p superba-router
      - name: Stage the release files
        run: |
          stage="$RUNNER_TEMP/stage"
          # The real notices come from cargo-about in the release workflow.
          printf 'Third-party notices placeholder for the package test.\n' > "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt"
          scripts/release/macos-bundle.sh --binary target/release/superba \
            --helper target/release/superba-router --version 0.1.0 --out "$stage" \
            --notices "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt"
          install -m 755 target/release/spb "$stage/spb"
          cp README.md LICENSE-MIT LICENSE-APACHE "$RUNNER_TEMP/THIRD-PARTY-NOTICES.txt" \
            crates/superba-gui/assets/fonts/LICENSE-Geist-OFL.txt "$stage/"
          codesign --force --sign - "$stage/Superba.app/Contents/MacOS/superba-router"
          codesign --force --sign - "$stage/Superba.app"
          codesign --force --sign - "$stage/spb"
          codesign --verify --strict --deep "$stage/Superba.app"
      - name: Build the DMG (layout, then the files) and read it back
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          mkdir -p dmg-test
          scripts/release/macos-dmg.sh layout --version "$version" --out "$RUNNER_TEMP/layout.dmg"
          scripts/release/macos-dmg.sh finish --layout "$RUNNER_TEMP/layout.dmg" \
            --staging "$RUNNER_TEMP/stage" --out "dmg-test/superba-$version-macos-universal.dmg"
          scripts/release/macos-dmg.sh inspect "dmg-test/superba-$version-macos-universal.dmg" \
            | tee dmg-test/layout.txt
          ls -l dmg-test
      - name: Open the window in Finder (light and dark)
        run: scripts/release/test-dmg.sh dmg-test/*.dmg dmg-test/macos-14
      - name: Keep the DMG, its layout and the screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dmg-test
          path: dmg-test/
          if-no-files-found: ignore
          retention-days: 3

  dmg-finder:
    needs: dmg-package
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.msi_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dmg-test
          path: dmg-test
      - name: Open the window in Finder (light and dark)
        run: scripts/release/test-dmg.sh dmg-test/*.dmg "shots/${{ matrix.os }}"
      - name: Keep the screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dmg-finder-${{ matrix.os }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 3
