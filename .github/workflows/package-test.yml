name: Package test

# Builds the Windows MSI on a hosted runner and exercises it per-user: install,
# files, spb --version, PATH, Add/Remove Programs, upgrade, uninstall. Manual
# only (no tag needed): gh workflow run package-test.yml --ref <branch>.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.98 --profile minimal
          rustup default 1.98
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package-test-msi
      - name: Build the Windows programs
        shell: bash
        run: cargo build --release --locked -p superba-gui -p superba-cli -p superba-router
      - name: Stage the release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path stage | Out-Null
          foreach ($b in 'superba','spb','superba-router') { Copy-Item "target/release/$b.exe" stage }
          Copy-Item LICENSE-MIT, LICENSE-APACHE, crates/superba-gui/assets/fonts/LICENSE-Geist-OFL.txt stage
          # The real notices come from cargo-about in the release workflow.
          'Third-party notices placeholder for the package test.' | Set-Content stage/THIRD-PARTY-NOTICES.txt
      - name: Install WiX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'wix install failed' }
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: Install, upgrade and uninstall the MSI
        shell: pwsh
        env:
          SUPERBA_SECRET_BACKEND: file
        run: ./scripts/release/test-msi.ps1 -StageDir stage
      - name: Keep the MSI and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msi-test
          path: ${{ runner.temp }}/msi-test/*
          if-no-files-found: ignore
          retention-days: 3
