["config:tui.status_line"]
en = """
Ordered list of status line item identifiers.

When set, the TUI renders the selected items as the status line. When unset, the TUI defaults to: `model-with-reasoning`, `current-dir`, and `thread-name`."""
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "cf5e278fa690a4be"
zh_name = "状态栏项目"
zh = "状态栏要显示的项目 ID 列表（按顺序）。未设置时默认为 `model-with-reasoning`、`current-dir` 和 `thread-name`；可选项目还有 Git 分支、上下文用量、限额剩余等，可用 `/statusline` 命令交互配置。"
zh_basis = "cf5e278fa690a4be"

["config:tui.status_line_use_colors"]
en = "Color status line items with colors derived from the active syntax theme. Defaults to `true`."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "79b102e1329b179f"
zh_name = "状态栏着色"
zh = "用当前语法高亮主题派生的颜色给状态栏项目着色，默认 `true`。"
zh_basis = "79b102e1329b179f"

["config:tui.terminal_resize_reflow_max_rows"]
en = "Trim terminal resize-reflow replay to the most recent rendered terminal rows when the transcript exceeds this cap. Omit to use Codex's terminal-specific default. Set to `0` to keep all rendered rows."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "e87959757d268076"
zh_name = "缩放重排行数上限"
zh = "终端窗口尺寸变化时，TUI 会重新排版并重放已渲染的对话记录；记录超过此行数时只重放最近的这些行。不设置时使用按终端类型决定的默认值（无法识别终端时为 1000 行），设为 `0` 则保留全部行。"
zh_basis = "e87959757d268076"

["config:tui.terminal_title"]
en = """
Ordered list of terminal title item identifiers.

When set, the TUI renders the selected items into the terminal window/tab title. When unset, the TUI defaults to: `activity`, `thread-name`, and `project-name`. The `activity` item spins while working and shows an action-required message when blocked on the user."""
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "e3e88c707c382359"
zh_name = "终端标题项目"
zh = "写入终端窗口/标签标题的项目 ID 列表（按顺序）。未设置时默认为 `activity`、`thread-name` 和 `project-name`；其中 `activity` 在工作时显示转动指示，等待用户操作时显示提醒。可用 `/title` 命令交互配置。"
zh_basis = "e3e88c707c382359"

["config:tui.theme"]
en = """
Syntax highlighting theme name (kebab-case).

When set, overrides automatic light/dark theme detection. Use `/theme` in the TUI or see `$CODEX_HOME/themes` for custom themes."""
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "c93c2c651087a4b9"
zh_name = "语法高亮主题"
zh = "语法高亮主题名（kebab-case），设置后不再自动按终端亮色/暗色选择主题。可在 TUI 中用 `/theme` 选择，自定义主题放在 `$CODEX_HOME/themes`。"
zh_basis = "c93c2c651087a4b9"

["config:tui.vim_mode_default"]
en = "Start the composer in Vim mode (`Normal`) by default. Defaults to `false`."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "359596ac6ade90af"
zh_name = "默认 Vim 模式"
zh = "输入框启动时默认进入 Vim 模式（普通模式 `Normal`），默认 `false`。运行中可用 `/vim` 切换。"
zh_basis = "359596ac6ade90af"

["config:tui.whimsy"]
en = "Enable decorative effects such as Astra composer stars. Also requires animations. Defaults to `true`."
