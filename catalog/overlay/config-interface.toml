en_hash = "64715a91555e4183"
zh_name = "右键粘贴"
zh = "全屏 TUI 在没有选中文字时的右键粘贴后备功能。默认 `auto`（仅 Windows/WSL/Linux）；`on` 还会在 macOS 上启用；两种模式在 SSH 中或已识别的 VS Code 终端里都不读取剪贴板。它只控制 Codex 的后备行为，不影响终端自身的粘贴快捷键。"
zh_basis = "64715a91555e4183"

["config:tui.right_click_paste=auto"]
