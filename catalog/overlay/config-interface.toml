["config:tui.disable_paste_burst"]
en = "When true, disables burst-paste detection for typed input entirely. All characters are inserted as they are received, and no buffering or placeholder replacement will occur for fast keypress bursts. Overrides the legacy top-level `disable_paste_burst` setting. Defaults to `false`."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "805fb983d92780c7"
zh_name = "禁用粘贴突发检测"
zh = "在不支持括号粘贴（bracketed paste）的终端里，Codex 会把短时间内连续到达的按键识别为一次粘贴，避免粘贴内容中的回车直接提交。设为 `true` 则完全关闭该检测，字符按收到的顺序逐个插入。默认 `false`，优先于顶层旧设置 `disable_paste_burst`。"
zh_basis = "805fb983d92780c7"

