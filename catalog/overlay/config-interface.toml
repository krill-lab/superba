["config:tui.alternate_screen"]
en = """
Controls whether the TUI uses the terminal's alternate screen buffer.

- `auto` (default): Use alternate screen. - `always`: Always use alternate screen. - `never`: Never use alternate screen (inline mode only, preserves scrollback)."""
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "6beb1054e9225998"
zh_name = "备用屏幕模式"
zh = "控制 TUI 是否使用终端的备用屏幕（alternate screen）。`auto`（默认）通常使用备用屏幕，但在 macOS 自带终端 Terminal.app 经 SSH 运行时改用原生回滚；`always` 始终使用；`never` 始终以内联模式运行并保留终端回滚历史。命令行参数 `--no-alt-screen` 优先于此设置。"
zh_basis = "6beb1054e9225998"

["config:tui.alternate_screen=always"]
