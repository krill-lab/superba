en_hash = "3f3bc5ce0e0494b8"
zh_name = "子代理默认模型"
zh = "派生子代理时调用没有指定模型，就使用这个模型；未设置时沿用父会话的模型。"
zh_basis = "3f3bc5ce0e0494b8"

["config:agents.default_subagent_reasoning_effort"]
en = "Default reasoning effort for spawned subagents when the spawn call does not select one."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "f627efb351308780"
zh_name = "子代理默认推理强度"
zh = "派生子代理时调用没有指定推理强度，就使用这个值（如 `low`、`medium`、`high`）；须是所选模型支持的级别。"
zh_basis = "f627efb351308780"

["config:agents.enabled"]
en = "Whether multi-agent tools are enabled. Defaults to true. An enabled `features.multi_agent_v2` setting takes precedence."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "a925aa4c7b807e85"
zh_name = "启用多代理"
zh = "是否向模型提供派生和管理子代理的多代理工具，默认 `true`。开启功能开关 `multi_agent_v2` 时以该开关为准。"
zh_basis = "a925aa4c7b807e85"

["config:agents.interrupt_message"]
en = "Whether to record a model-visible message when an agent turn is interrupted. Defaults to true."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "bbd662cf854bdcd6"
zh_name = "记录中断提示"
zh = "轮次被中断时，是否在历史中写入一条模型可见的中断说明，让模型知道上一轮被打断，默认 `true`。"
zh_basis = "bbd662cf854bdcd6"

["config:agents.max_concurrent_threads_per_session"]
en = "Maximum number of spawned agent threads that can be open concurrently per session. When unset, the selected multi-agent backend uses its default."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "f6a067a6dd12c57e"
zh_name = "子代理并发上限"
zh = "每个会话中可同时存在的子代理数量上限（旧名 `max_threads`），至少为 1。未设置时由所用多代理版本决定：V1 默认 6 个，V2 默认 3 个。"
zh_basis = "f6a067a6dd12c57e"

["config:agents.max_depth"]
en = "Maximum nesting depth for V1 agent threads. Ignored by V2."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "6ce07a5f035e5799"
zh_name = "子代理嵌套深度"
zh = "V1 多代理中子代理可以逐层派生的最大层数，默认 `1`，即子代理不能再派生子代理；V2 忽略此项。"
zh_basis = "6ce07a5f035e5799"

