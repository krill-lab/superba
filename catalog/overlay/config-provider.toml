zh = "直接写在配置文件里、用于 `Authorization: Bearer <token>` 请求头的令牌。出于安全考虑官方建议改用 `env_key`，此项主要用于程序化生成配置的场景。"
zh_basis = "a596e9a5158615bd"

["config:model_providers.<name>.gateway_oauth"]
en = "Secondary OAuth credentials required by the provider's gateway."
en_source = "openai/codex rust-v0.156.0: codex-rs/core/config.schema.json"
en_hash = "d4b95f28e4219114"
zh_name = "网关 OAuth 凭据"
zh = "模型供应商前置网关要求的第二套 OAuth 凭据，与主认证一起发送。Codex 通过浏览器授权码流程（PKCE）登录并自动刷新令牌，再按 `delivery` 以请求头或 Cookie 附加；必须设置 `base_url`，不能与 AWS 认证同时使用。"
zh_basis = "d4b95f28e4219114"

["config:model_providers.<name>.gateway_oauth.authorization_url"]
en = ""
en_hash = ""
zh_name = "网关授权地址"
zh = "OAuth 授权端点，用于在浏览器中发起登录。必须是 HTTPS（本机回环地址可用 HTTP），且不能包含用户名、密码或片段（`#`）。"
zh_basis = ""

["config:model_providers.<name>.gateway_oauth.client_id"]
en = ""
en_hash = ""
zh_name = "网关客户端 ID"
zh = "在网关的 OAuth 服务中注册的客户端 ID，不能为空。"
zh_basis = ""

["config:model_providers.<name>.gateway_oauth.delivery"]
en = ""
en_hash = ""
zh_name = "网关令牌附加方式"
zh = '网关令牌如何附加到请求上：`kind = "header"` 时放进指定的请求头，`kind = "cookie"` 时放进指定名称的 Cookie。'
zh_basis = ""

["config:model_providers.<name>.gateway_oauth.delivery.kind"]
en = ""
en_hash = ""
zh_name = "附加位置"
zh = "`header`（请求头）或 `cookie`（Cookie）。"
zh_basis = ""

["config:model_providers.<name>.gateway_oauth.delivery.name"]
en = ""
en_hash = ""
zh_name = "请求头或 Cookie 名"
zh = "承载网关令牌的请求头名称或 Cookie 名称。不能使用 `Authorization`、`Cookie`、`Host` 等保留请求头或 `x-codex-`、`x-openai-` 前缀，也不能与 `http_headers`、`env_http_headers` 中已有的请求头重名。"
zh_basis = ""

["config:model_providers.<name>.gateway_oauth.delivery.scheme"]
en = ""
en_hash = ""
zh_name = "认证方案前缀"
zh = '仅 `kind = "header"` 时使用：写在令牌前面的认证方案，默认 `Bearer`，即发送 `Bearer <token>`。'
zh_basis = ""

["config:model_providers.<name>.gateway_oauth.redirect_port"]
en = ""
en_hash = ""
zh_name = "登录回调端口"
zh = "登录回调使用的本机端口，Codex 在 `127.0.0.1` 上监听它接收授权结果；不设置时随机选择空闲端口，不能设为 `0`。"
zh_basis = ""

["config:model_providers.<name>.gateway_oauth.resource"]
en = ""
en_hash = ""
zh_name = "资源标识"
zh = "可选的 OAuth `resource` 参数（资源指示符），在授权、换取令牌和刷新令牌时一并发送。"
zh_basis = ""

["config:model_providers.<name>.gateway_oauth.scopes"]
en = ""
en_hash = ""
zh_name = "授权范围"
zh = "申请的 OAuth scope 列表，发送时以空格连接。"
zh_basis = ""

["config:model_providers.<name>.gateway_oauth.token_url"]
en = ""
en_hash = ""
zh_name = "网关令牌地址"
zh = "OAuth 令牌端点，用于以授权码换取令牌和刷新令牌。要求与 `authorization_url` 相同：HTTPS（本机回环地址可用 HTTP）。"
zh_basis = ""

["config:model_providers.<name>.http_headers"]
