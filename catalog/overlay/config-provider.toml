# Superba Codex settings catalog: text overlay.
#
# Each table is one catalog entry: `feature:<key>`, `config:<path>` or
# `config:<path>=<value>`. `superba-catalog-gen overlay-sync` maintains the
# generator-owned fields and adds or retires entries:
#   en, en_name  official upstream English, copied verbatim (empty = upstream has none)
#   en_source    where that text comes from (first release with this wording)
#   en_hash      fingerprint of en_name + en
# Maintainers own the other fields (see catalog/CONTRIBUTING.md):
#   zh, zh_name  Chinese name / explanation, written per entry from the codex source
#   zh_basis     the en_hash the Chinese text was written against
#   en_note      English note, only where upstream has no text
# Comments in this file are not preserved; put remarks in the pull request.

format = 1

["config:chatgpt_base_url"]
en = "Base URL for requests to ChatGPT (as opposed to the OpenAI API)."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "9b79515e84139d35"
zh_name = "ChatGPT 后端地址"
zh = "ChatGPT 后端接口（而非 OpenAI API）的基础地址，默认 `https://chatgpt.com/backend-api/`。账号额度与用量、插件和应用连接器、云任务、使用统计等请求发往这里，模型推理请求则走 `openai_base_url` 或模型供应商的 `base_url`；项目内的 `.codex/config.toml` 不能设置此项。"
zh_basis = "9b79515e84139d35"

["config:cli_auth_credentials_store"]
en = "Preferred backend for storing CLI auth credentials. file (default): Use a file in the Codex home directory. keyring: Use an OS-specific keyring service. auto: Use the keyring if available, otherwise use a file."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "997d3dc662158756"
zh_name = "登录凭据存储方式"
zh = "CLI 登录凭据（API key、ChatGPT 令牌等）的存放位置：`file`（默认，`$CODEX_HOME/auth.json`）、`keyring`（系统钥匙串）、`auto`（有钥匙串就用钥匙串，否则用文件）或 `ephemeral`（只留在当前进程内存中）。"
zh_basis = "997d3dc662158756"

["config:cli_auth_credentials_store=auto"]
