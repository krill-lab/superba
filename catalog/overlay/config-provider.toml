["config:forced_chatgpt_workspace_id"]
en = "When set, restricts ChatGPT login to one or more workspace identifiers."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "7e6fa7ad9eeb3e48"
zh_name = "限定 ChatGPT 工作区"
zh = "设置后只允许登录指定的 ChatGPT 工作区，可写单个 ID 或 ID 数组（不支持逗号分隔的字符串）。当前 ChatGPT 类凭据（含个人访问令牌 PAT）属于其他工作区时 Codex 会自动登出；单独设置此项时 API key 登录不受影响。"
zh_basis = "7e6fa7ad9eeb3e48"

["config:forced_login_method"]
en = "When set, restricts the login mechanism users may use."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "84b85ab057f841ef"
zh_name = "限定登录方式"
zh = "限制可用的登录方式：`chatgpt` 只允许 ChatGPT 账号类登录（含个人访问令牌 PAT），`api` 只允许 API key。若当前凭据与要求不符，Codex 会直接登出。"
zh_basis = "84b85ab057f841ef"

["config:model_provider"]
