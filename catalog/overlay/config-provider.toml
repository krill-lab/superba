["config:model_providers.<name>.request_max_retries"]
en = "Maximum number of times to retry a failed HTTP request to this provider."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "38f5bb22e646f891"
zh_name = "请求最大重试次数"
zh = "发往该模型供应商的 HTTP 请求失败后的最大重试次数，默认 4，上限 100。只重试 5xx 和网络传输错误，不重试 429。"
zh_basis = "38f5bb22e646f891"

["config:model_providers.<name>.requires_openai_auth"]
en = "Does this provider require an OpenAI API key or ChatGPT login token? If true, the user is presented with a login screen on first run, and credentials are stored using the backend selected by `cli_auth_credentials_store`. If false (the default), the login screen is skipped, and the API key (if needed) comes from the environment variable specified by `env_key`."
en_source = "openai/codex rust-v0.160.0: codex-rs/core/config.schema.json"
en_hash = "34e08393c97bdef6"
zh_name = "需要 OpenAI 登录"
zh = "该模型供应商是否使用 OpenAI 的登录凭据（API key 或 ChatGPT 令牌）。为 `true` 时首次运行会显示登录界面，凭据按 `cli_auth_credentials_store` 保存；为 `false`（默认）时跳过登录，key 从 `env_key` 指定的环境变量读取。不能与 `auth`、`aws` 同时使用。"
zh_basis = "34e08393c97bdef6"

["config:model_providers.<name>.stream_idle_timeout_ms"]
en = "Idle timeout (in milliseconds) to wait for activity on a streaming response before treating the connection as lost."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "b03348af8677e39a"
zh_name = "流式空闲超时"
zh = "流式响应多久（毫秒）没有任何数据就视为连接已断开，默认 300000（5 分钟）。"
zh_basis = "b03348af8677e39a"

["config:model_providers.<name>.stream_max_retries"]
en = "Number of times to retry reconnecting a dropped streaming response before failing."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "5ea5d4c422e1e6b1"
zh_name = "流式重连次数"
zh = "流式响应中途断开后重新连接的最大次数，用完后本次请求失败；默认 5，上限 100。"
zh_basis = "5ea5d4c422e1e6b1"

["config:model_providers.<name>.supports_standalone_web_search"]
en = "Whether this provider supports the standalone web-search endpoint."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "1a36c9e9c185d18a"
zh_name = "支持独立搜索接口"
zh = "该模型供应商是否提供独立的联网搜索接口（`POST <base_url>/alpha/search`）。自定义模型供应商默认 `false`，OpenAI 内置供应商默认支持。"
zh_basis = "1a36c9e9c185d18a"

["config:model_providers.<name>.supports_websockets"]
en = "Whether this provider supports the Responses API WebSocket transport."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "7080e8bf114b69c2"
zh_name = "支持 WebSocket 传输"
zh = "该模型供应商是否支持通过 WebSocket 传输 Responses API。为 `true` 时 Codex 可以经 WebSocket 发送请求；自定义模型供应商默认 `false`，OpenAI 内置供应商默认支持。不能与 `aws` 同时使用。"
zh_basis = "7080e8bf114b69c2"

["config:model_providers.<name>.websocket_connect_timeout_ms"]
en = "Maximum time (in milliseconds) to wait for a websocket connection attempt before treating it as failed."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "507cc7ef92023fae"
zh_name = "WebSocket 连接超时"
zh = "建立 WebSocket 连接的最长等待时间（毫秒），超时视为连接失败，默认 15000（15 秒）。"
zh_basis = "507cc7ef92023fae"

["config:model_providers.<name>.wire_api"]
en = "Which wire protocol this provider expects."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "a609e3b7e29da7c2"
zh_name = "接口协议"
zh = "该模型供应商使用的接口协议。目前只支持 `responses`（默认）；旧的 `chat`（Chat Completions）已移除，配置后会报错。"
zh_basis = "a609e3b7e29da7c2"

["config:model_providers.<name>.wire_api=responses"]
en = "The Responses API exposed by OpenAI at `/v1/responses`."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "63abe3be1d8a4299"
zh_name = "Responses API"
zh = "OpenAI 在 `/v1/responses` 提供的 Responses API，请求发往 `<base_url>/responses`。"
zh_basis = "63abe3be1d8a4299"

["config:openai_base_url"]
en = "Base URL override for the built-in `openai` model provider."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "5c61263fb39b5afc"
zh_name = "OpenAI 接口地址"
zh = "覆盖内置 `openai` 模型供应商的基础地址，`model_provider` 仍保持 `openai`。不设置时按登录方式选择：ChatGPT 账号类登录（含 PAT）用 `https://chatgpt.com/backend-api/codex`，API key 用 `https://api.openai.com/v1`；项目内的 `.codex/config.toml` 不能设置此项。"
zh_basis = "5c61263fb39b5afc"

["config:profile"]
en = "Profile to use from the `profiles` map."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "491bc9f23a4727f3"
zh_name = "默认配置档（旧版）"
zh = '旧版写法：在 `config.toml` 中用 `profile = "名称"` 选择 `profiles` 里的配置档。Codex 已不再支持，写了会报错，并提示改用 `--profile 名称` 加 `$CODEX_HOME/名称.config.toml`。'
zh_basis = "491bc9f23a4727f3"

["config:profiles"]
en = "Named profiles to facilitate switching between different configurations."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "195d283aa5b5d169"
zh_name = "配置档表（旧版）"
zh = "旧版写法：在 `[profiles.名称]` 下定义一组可切换的设置。当前 Codex 仍能解析该表但不再应用其中的设置；新写法是把差异项放进 `$CODEX_HOME/名称.config.toml`，再用 `--profile 名称` 启动（同名旧表仍存在时会报错）。"
zh_basis = "195d283aa5b5d169"
