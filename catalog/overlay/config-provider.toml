zh = ""

["config:model_providers.<name>.model_catalog_url"]
en = "Optional full URL for a Codex-native model catalog. When unset, OpenAI discovery uses the Codex backend unless `base_url` overrides the inference endpoint."
en_source = "openai/codex rust-v0.156.0: codex-rs/core/config.schema.json"
en_hash = "e977b1a10d0efe8a"
zh_name = "模型目录地址"
zh = "Codex 原生格式模型目录的完整 URL。不设置时模型列表从 `<base_url>/models` 获取（OpenAI 内置供应商未改 `base_url` 时走 Codex 后端）；设置后改从此地址获取，且不跟随重定向。"
zh_basis = "e977b1a10d0efe8a"

["config:model_providers.<name>.name"]
en = "Friendly display name."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "7c17f14ef3edc623"
zh_name = "显示名称"
zh = "该模型供应商在界面中显示的友好名称。注意：名称恰好是 `OpenAI` 时，Codex 会把它当作 OpenAI 供应商对待（依据源码）。"
zh_basis = "7c17f14ef3edc623"

["config:model_providers.<name>.project_id"]
