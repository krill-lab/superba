en_hash = "df114df2b872f005"
zh_name = "令牌刷新间隔"
zh = "缓存令牌的最长使用时间（毫秒），到期后重新运行命令，默认 300000（5 分钟）。设为 `0` 表示不主动刷新，只在请求返回 401 后重新获取。"
zh_basis = "df114df2b872f005"

["config:model_providers.<name>.auth.timeout_ms"]
en = "Maximum time to wait for the token command to exit successfully."
