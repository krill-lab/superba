zh_basis = ""

["feature:artifact"]
en = ""
en_hash = ""
zh_name = "原生 artifact 工具"
zh = "原意是启用原生 artifact 工具。Codex 0.163 源码中没有其他代码读取这个开关，它也不出现在配置 schema 中，开启后在 Codex 本身看不到效果（依据源码推断）。开发中，默认关闭。"
zh_basis = ""

["feature:async_compaction"]
en = ""
en_hash = ""
zh_name = "后台预压缩"
zh = "在上下文用量达到前台自动压缩阈值之前，提前在后台准备远程压缩结果，到时直接采用，减少压缩上下文时的等待。默认在用量达到上下文窗口的 65% 时开始，可用 `[features.async_compaction]` 中的 `model_async_compact_threshold_percent`（1–100）调整；只在模型供应商支持远程压缩 v2 且未启用 `token_budget` 时生效。开发中，默认关闭。"
zh_basis = ""

["feature:auth_elicitation"]
en = ""
en_hash = ""
zh_name = "连接器授权提示"
zh = "Codex Apps 应用连接器因未授权或授权失效而调用失败时，通过 MCP URL elicitation 向用户弹出授权或安装链接，而不是把错误直接交给模型；同时向 MCP 服务器声明客户端支持表单和 URL 两种 elicitation。审批策略为 `never` 时不会弹出。默认开启。"
zh_basis = ""

["feature:background_paginated_rollout_migration"]
en = ""
en_hash = ""
zh_name = "会话记录后台迁移"
zh = "在后台把旧格式的本地会话记录（rollout 文件）逐个迁移为分页历史格式，并把历史写入本地 SQLite。迁移过程保证任何时候要么保留原文件，要么留下可恢复的新文件。开发中，默认关闭。"
zh_basis = ""

["feature:bedrock_setup_wizard"]
en = ""
en_hash = ""
zh_name = "Bedrock 设置向导"
zh = "在终端界面（TUI）的登录引导中提供 Amazon Bedrock 设置选项。只在使用内置 `openai` 模型供应商、未显式设置 `model_provider` 且允许 API 登录方式时出现。0.164 起为稳定功能并默认开启。"
zh_basis = ""

["feature:browser_annotation_api"]
en = ""
en_hash = ""
zh_name = "网页标注接口"
zh = "桌面 app 的管理开关：是否允许网页在桌面 app 中打开并定制标注工具，用户自己发起的普通标注不受影响。应由管理员在托管配置（requirements）中设置，而不是写在用户 config.toml 里；Codex CLI 本身不读取它。默认开启。"
zh_basis = ""

