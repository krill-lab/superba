en_hash = ""
zh_name = "TUI 使用 app-server"
zh = "已移除。终端界面（TUI）现在总是基于 app-server 实现，保留此键只为兼容旧配置。"
zh_basis = ""

["feature:tui_multi_backend"]
en = ""
en_hash = ""
zh_name = "TUI 多后端"
zh = "允许终端界面（TUI）发现多个对话后端并在其间选择。依据源码推断：0.166.0-alpha.1 中除功能注册外尚无代码读取此开关。开发中，默认关闭。"
zh_basis = ""

["feature:ultrafast_mode"]
en = ""
en_hash = ""
zh_name = "Ultra Fast 模式"
zh = '允许使用 Ultra Fast 服务档位，独立于 Fast 模式：配置中的 `service_tier = "ultrafast"` 只有开启时才生效，终端界面也会提供相应选项。默认开启。'
zh_basis = ""

["feature:unavailable_dummy_tools"]
en = ""
en_hash = ""
zh_name = "不可用工具占位"
zh = "已移除。曾为历史记录中已不可用的工具调用补充占位工具；该功能已删除，设置后被忽略。"
zh_basis = ""

["feature:unbounded_connection_retries"]
en = ""
en_hash = ""
zh_name = "断网持续重连"
zh = "采样请求因网络连接失败时，不在重试次数用尽后报错，而是保留当前轮次并持续等待网络恢复后重连（界面显示 Reconnecting... waiting for network）。只针对连接失败，不针对服务端返回的错误状态，也不适用于 Amazon Bedrock。默认开启。"
zh_basis = ""

["feature:undo"]
en = ""
en_hash = ""
zh_name = "撤销（幽灵提交）"
zh = "已移除。曾在每个轮次创建一个幽灵提交（ghost commit）以支持撤销；现在保留为无效键，只为让旧配置中的 `undo` 能被解析。"
zh_basis = ""

["feature:unified_exec"]
en = ""
en_hash = ""
zh_name = "统一执行工具"
zh = "使用基于 PTY 的统一命令执行工具（`exec_command` 与 `write_stdin`），支持长时间运行和交互式进程。用户配置无法关闭它，旧的关闭写法会被忽略，只有托管配置（requirements）能禁用，禁用后命令改为一次性执行。默认开启；旧键名 `experimental_use_unified_exec_tool` 仍被接受。"
zh_basis = ""

["feature:unified_exec_tty"]
en = ""
en_hash = ""
zh_name = "交互式终端（TTY）"
zh = "允许统一执行工具为命令分配交互式终端（TTY），以运行需要终端交互的程序；关闭后请求 TTY 的命令会被拒绝。默认开启。"
zh_basis = ""

["feature:unified_exec_zsh_fork"]
en = ""
en_hash = ""
zh_name = "统一执行 zsh 桥（旧）"
zh = "已移除。曾允许统一执行工具与打过补丁的 zsh 执行桥组合使用；该后端已删除，设置后会提示删除此项。"
zh_basis = ""

["feature:unified_image_budget"]
en = ""
en_hash = ""
zh_name = "统一图片预算"
zh = "对每张图片使用统一的像素与 token 预算进行预处理，不再依据旧的 detail 提示。只对使用 Responses Lite 格式或支持原始图片细节的模型生效。开发中，默认关闭。"
zh_basis = ""

["feature:untrusted_as_tool_output"]
en = ""
en_hash = ""
zh_name = "不可信上下文作为工具输出"
zh = "客户端随轮次附带的不可信上下文（additional context）改为以单独的具名工具输出交给模型，而不是作为普通消息插入。开发中，默认关闭。"
zh_basis = ""

["feature:use_agent_identity"]
en = ""
en_hash = ""
zh_name = "代理身份认证"
zh = "使用 ChatGPT 登录的会话改用 Agent Identity（代理身份）认证策略，而不是只用 JWT。开发中，默认关闭。"
zh_basis = ""

["feature:use_legacy_landlock"]
en = ""
en_hash = ""
zh_name = "旧版 Landlock 沙箱"
zh = "已弃用。在 Linux 上改用旧的 Landlock 沙箱回退方案，而不是默认的 bubblewrap 沙箱；即将移除，使用时会给出提示。默认关闭。"
zh_basis = ""

["feature:use_linux_sandbox_bwrap"]
en = ""
en_hash = ""
zh_name = "bubblewrap 沙箱（旧）"
zh = "已移除。曾用于在 Linux 上选择启用 bubblewrap 沙箱；现在 bubblewrap 已是默认方案，此键保留为无效项，只为兼容旧脚本和配置。"
zh_basis = ""

["feature:use_xaa"]
en = ""
en_hash = ""
zh_name = "MCP 企业令牌授权"
zh = "对配置了企业托管认证（`mcp_enterprise_managed_auth`）的 MCP 资源启用企业刷新令牌授权（XAA）。必须在用户级配置或托管配置中开启，项目级 `.codex/config.toml` 中的设置无效。开发中，默认关闭。"
zh_basis = ""

["feature:view_image"]
en = ""
en_hash = ""
zh_name = "本地图片查看"
zh = "启用内置的本地图片查看工具，让模型可以把本地图片文件加载进上下文查看。默认开启。"
zh_basis = ""

["feature:wake_on_agent_messages"]
en = ""
en_hash = ""
zh_name = "代理消息唤醒会话"
zh = "根会话的上一轮次结束、处于空闲时，收到其他代理（如子代理）发来的消息也会自动开始新的轮次，而不必等待用户输入。只对根会话生效，且当前协作模式须允许自动开始轮次。开发中，默认关闭。"
zh_basis = ""

["feature:web_search_cached"]
en = ""
en_hash = ""
zh_name = "缓存联网搜索（旧）"
zh = '已弃用。曾允许模型发起读取缓存内容的联网搜索；未设置顶层 `web_search` 时仍会被解释为 `web_search = "cached"`（优先于 `web_search_request`）。请改用顶层 `web_search`（`live`、`indexed`、`cached` 或 `disabled`）。'
zh_basis = ""

["feature:web_search_request"]
en = ""
en_hash = ""
zh_name = "实时联网搜索（旧）"
zh = '已弃用。曾允许模型发起读取实时内容的联网搜索；未设置顶层 `web_search` 时仍会被解释为 `web_search = "live"`，`[features]` 中的旧键名 `web_search` 也对应此项。请改用顶层 `web_search`。'
zh_basis = ""

["feature:windows_sandbox_service"]
en = ""
en_hash = ""
zh_name = "Windows 沙箱服务"
zh = "在 Windows 上设置提权沙箱时，尝试通过已安装的系统服务完成提权配置。开发中，默认关闭。"
zh_basis = ""

["feature:workspace_dependencies"]
en = ""
en_hash = ""
zh_name = "工作区依赖"
zh = "启用工作区依赖支持：桌面 app 为本地会话准备内置的运行时依赖，并提供 `load_workspace_dependencies` 工具。此开关由桌面 app 读取，Codex CLI 本身不使用。默认开启。"
zh_basis = ""

["feature:workspace_owner_usage_nudge"]
en = ""
en_hash = ""
zh_name = "工作区所有者用量提醒"
zh = "已移除。曾在终端界面中显示面向工作区所有者的用量提醒文案；现在该提醒总是开启，保留此键只为兼容旧配置。"
zh_basis = ""

["feature:worktrees"]
en = ""
en_hash = ""
zh_name = "托管工作树"
zh = "已移除（0.164 起）。曾用于开关托管的 Git worktree（`/worktree`）；现在该功能是否可用不再取决于此开关，设置后被忽略。"
zh_basis = ""

["feature:write_stdin_approval"]
en = ""
en_hash = ""
zh_name = "写入终端需审批"
zh = "向以提权（沙箱外）方式启动的统一执行终端写入新的输入前，需要再次审批，避免借已获批的终端执行未经审批的命令。0.158 起为稳定功能并默认开启。"
zh_basis = ""
