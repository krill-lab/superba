en = ""
en_hash = ""
zh_name = "Git 提交署名指引"
zh = "已移除。早期版本通过模型指令加入 Git 提交署名（attribution）指引；该开关已删除，设置后被忽略。"
zh_basis = ""

["feature:collaboration_modes"]
en = ""
en_hash = ""
zh_name = "协作模式"
zh = "已移除。曾用于启用协作模式（Plan 计划模式与 Default 默认模式）；现在协作模式总是开启，保留此键只为兼容旧配置。"
zh_basis = ""

["feature:compaction_image_budget"]
en = ""
en_hash = ""
zh_name = "压缩计入图片预算"
zh = "远程压缩上下文时，把压缩后仍保留在历史中的图片计入上下文预算。默认开启。"
zh_basis = ""

["feature:computer_use"]
en = ""
en_hash = ""
zh_name = "Computer Use 电脑操作"
zh = "桌面 app 的管理开关：是否允许使用 Codex Computer Use，让代理操作电脑界面。应由管理员在托管配置（requirements）中设置，而不是写在用户 config.toml 里；Codex CLI 本身不读取它。默认开启。"
zh_basis = ""

["feature:concurrent_reasoning_summaries"]
en = ""
en_hash = ""
zh_name = "推理摘要顺序截断"
zh = "请求推理摘要时，要求 OpenAI 以顺序截断（`SequentialCutoff`）方式交付推理摘要。只在内置 OpenAI 模型供应商且请求了推理摘要时生效。开发中，默认关闭。"
zh_basis = ""

["feature:content_item_kinds"]
en = ""
en_hash = ""
zh_name = "内容条目分类"
zh = "在发往 Responses API 的内部元数据中附带每个内容条目的分类；关闭时发送前清除这些分类。属于请求层面的内部开关，对使用体验没有直接影响。默认开启。"
zh_basis = ""

["feature:context_management"]
en = ""
en_hash = ""
zh_name = "实验性上下文管理"
zh = "启用实验性上下文管理：对支持的模型自动开启 `token_budget`，并提供历史与笔记扩展，让模型在上下文窗口轮换前记录笔记。只对使用 ChatGPT 登录、Plus 或 Pro 套餐且走官方 Codex 后端的会话生效，API key 或自定义认证无效；以 TOML 表的形式开启时写作 `[features.context_management]` 中的 `experimental_mode = true`。开发中，默认关闭。"
zh_basis = ""

["feature:credential_masking"]
en = ""
en_hash = ""
zh_name = "凭据遮蔽"
zh = "沙箱内的命令只拿到遮蔽后的凭据占位值，真实凭据由已启用的网络代理在出站请求时注入，凭据来源在 `[features.network_proxy].credentials` 中配置。需要同时启用 `network_proxy` 并使用沙箱，关闭沙箱时不生效并给出警告。开发中，默认关闭。"
zh_basis = ""

["feature:critical_path_timing"]
en = ""
en_hash = ""
zh_name = "关键路径耗时统计"
zh = "记录轮次中直接工具调用之间的依赖关系，把轮次耗时拆成推理、自动审查、等待用户、工具执行等关键路径时长，写入轮次的使用统计事件；出现代理间消息时，该轮次的关键路径记为无效。开发中，默认关闭。"
zh_basis = ""

["feature:current_time_reminder"]
en = ""
en_hash = ""
zh_name = "当前时间提醒"
zh = "定期在模型可见的上下文中插入当前时间，并提供查询当前时间的工具。可在 `[features.current_time_reminder]` 中设置提醒间隔（`reminder_interval_seconds`，默认 1 秒）、时钟来源（`system` / `external`）、投递时机，以及是否提供可被打断的 `clock.sleep` 工具。开发中，默认关闭。"
zh_basis = ""

["feature:cwd_relative_turn_diffs"]
en = ""
en_hash = ""
zh_name = "按工作目录显示差异"
zh = "显示每个轮次的文件改动（diff）时，路径相对当前工作目录，而不是先探测 Git 仓库根目录再相对仓库根显示。开发中，默认关闭。"
zh_basis = ""

["feature:daemon_auto_start"]
en = ""
en_hash = ""
zh_name = "自动启动后台服务"
zh = "交互式启动 `codex` 时自动启动或连接本机共享的后台服务（app-server 守护进程），多个终端会话共用它，可用 `/daemon` 管理。单次启动加 `--no-daemon` 可不使用；远程工作区不会自动启动。0.157 起为稳定功能并默认开启。"
zh_basis = ""

["feature:default_mode_request_user_input"]
en = ""
en_hash = ""
zh_name = "默认模式允许提问"
zh = "允许模型在默认协作模式下也使用 `request_user_input` 工具向用户提出带选项的问题；不开启时只有计划模式等特定模式可用。开发中，默认关闭。"
zh_basis = ""

["feature:defer_mailbox_preemption"]
en = ""
en_hash = ""
zh_name = "延迟投递代理消息"
zh = "多代理协作时，其他代理发来的消息不再打断当前正在生成的回复，模型可以继续完成推理和说明，消息改在下一个正常输入边界投递。开发中，默认关闭。"
zh_basis = ""

