en_hash = ""
zh_name = "Browser Use 集成"
zh = "桌面 app 的管理开关：是否允许在桌面 app 中使用 Browser Use 代理集成，让代理操作浏览器。应由管理员在托管配置（requirements）中设置，而不是写在用户 config.toml 里；Codex CLI 本身不读取它。默认开启。"
zh_basis = ""

["feature:browser_use_external"]
en = ""
en_hash = ""
