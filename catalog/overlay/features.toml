zh_basis = ""

["feature:remote_compaction_v2"]
en = ""
en_hash = ""
zh_name = "远程压缩 v2"
zh = "已移除。保留此键只为兼容旧配置，设置后被忽略；Codex 总会在 `x-codex-beta-features` 请求头中向 Responses API 声明支持远程压缩 v2。"
zh_basis = ""

["feature:remote_control"]
en = ""
en_hash = ""
