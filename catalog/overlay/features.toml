zh = "桌面 app 的管理开关：是否允许 Browser Use 集成操作外部浏览器，而不只是桌面 app 内置的浏览器。应由管理员在托管配置（requirements）中设置；Codex CLI 本身不读取它。默认开启。"
zh_basis = ""

["feature:browser_use_full_cdp_access"]
en = ""
en_hash = ""
zh_name = "Browser Use 完整 CDP"
zh = "桌面 app 的管理开关：是否允许 Browser Use 集成使用完整的 Chrome DevTools Protocol（CDP）能力。应由管理员在托管配置（requirements）中设置；Codex CLI 本身不读取它。默认开启。"
zh_basis = ""

["feature:chronicle"]
en = ""
en_hash = ""
zh_name = "Chronicle 屏幕记忆"
zh = "启用 Chronicle 旁路进程，被动采集屏幕上下文并生成记忆。Codex 0.163 中除了接受此开关（旧键名 `telepathy`）外没有其他代码读取它，实际功能应由桌面 app 提供（依据源码推断）。开发中，默认关闭。"
zh_basis = ""

["feature:cli_daybreak"]
en = ""
en_hash = ""
zh_name = "CLI Daybreak 控制"
zh = "在 Codex CLI（终端界面和 `codex exec`）中启用 Daybreak：提供 `/daybreak` 开关，并在每个轮次按模型公布的访问计划自动选择标准计划或 Daybreak 网络安全计划（cyber access program）。Daybreak 需要 ChatGPT 账号或 OpenAI API key，且只能配合 OpenAI 模型供应商使用。0.163 起为稳定功能并默认开启。"
zh_basis = ""

["feature:code_mode"]
en = ""
en_hash = ""
zh_name = "代码模式"
zh = "启用 JavaScript 代码模式：模型不再逐个直接调用工具，而是编写 JavaScript，在独立的代码模式宿主进程中通过 `exec` / `wait` 组合调用工具。模型元数据声明了工具模式时以模型为准，模型未声明支持时会警告可能降低效果；超时等细项在 `[features.code_mode]` 下配置。开发中，默认关闭。"
zh_basis = ""

["feature:code_mode_buffered_exec"]
en = ""
en_hash = ""
zh_name = "代码模式缓冲执行"
zh = "已移除。曾用于让代码模式 `exec` 调用的让出（yield）超时可配置；该开关已删除，设置后被忽略，默认让出时间现由 `[features.code_mode].default_exec_yield_time_ms` 设置。"
zh_basis = ""

["feature:code_mode_host"]
en = ""
en_hash = ""
zh_name = "代码模式宿主进程"
zh = "在独立的宿主进程（`codex-code-mode-host`）中运行 JavaScript 代码模式；连接远程代码模式宿主时也必须开启。关闭后代码模式不可用，工具改为直接调用，除非 `[features.code_mode_host]` 中设置了 `disable_in_process_fallback = true`。默认开启。"
zh_basis = ""

["feature:code_mode_host_grpc"]
en = ""
en_hash = ""
zh_name = "代码模式宿主 gRPC"
zh = "Codex 与自己启动的代码模式宿主进程之间改用基于标准输入输出的 gRPC 通信，替代默认的通信方式。开发中，默认关闭。"
zh_basis = ""

["feature:code_mode_interrupt"]
en = ""
en_hash = ""
zh_name = "中断时终止代码单元"
zh = "用户中断当前轮次时，同时终止代码模式中仍在运行的代码单元（cell），避免它们在后台继续执行。0.163 起为稳定功能并默认开启。"
zh_basis = ""

["feature:code_mode_only"]
en = ""
en_hash = ""
zh_name = "仅代码模式"
zh = "把模型可见的工具限制为代码模式入口（`exec`、`wait`），其他工具只能在 JavaScript 中间接调用；开启它会自动同时开启 `code_mode`。模型元数据声明了工具模式时以模型为准。开发中，默认关闭。"
zh_basis = ""

["feature:code_mode_only_strict_3p_tools"]
en = ""
en_hash = ""
zh_name = "严格延迟第三方工具"
zh = "只在“仅代码模式”下生效：符合条件的 MCP 工具、应用连接器工具和动态工具一律延迟加载，只能在 `exec` 中使用，并忽略 `deferLoading`、`omit_tools_from` 和命名空间跳过等设置。开发中，默认关闭。"
zh_basis = ""

["feature:code_mode_prewarm"]
en = ""
en_hash = ""
zh_name = "代码模式预热"
zh = "在会话启动时就预先建立与代码模式宿主进程的连接，减少第一次执行代码时的等待。开发中，默认关闭。"
zh_basis = ""

["feature:code_mode_tool_description_first"]
en = ""
en_hash = ""
zh_name = "工具描述优先"
zh = "代码模式中呈现工具定义时，把每个工具自身的描述放在其命名空间描述之前；工具搜索结果的呈现也随之改变。开发中，默认关闭。"
zh_basis = ""

["feature:code_mode_tool_search"]
en = ""
en_hash = ""
zh_name = "代码模式工具搜索"
zh = "在 JavaScript 代码模式内部提供按相关度排序的工具搜索（`tool_search`），让模型在代码中查找延迟加载的工具。开发中，默认关闭。"
zh_basis = ""

["feature:codex_apps_mcp_2026_07_28"]
en = ""
en_hash = ""
zh_name = "Apps MCP 新协议"
zh = "让 Codex 自带的 Codex Apps MCP 服务器（应用连接器）使用 MCP 协议版本 2026-07-28，关闭时使用旧版协议；其他 MCP 服务器由 `mcp_2026_07_28` 控制。开发中，默认关闭。"
zh_basis = ""

