["feature:enable_mcp_apps"]
en = ""
en_hash = ""
zh_name = "MCP Apps 界面"
zh = "启用 MCP Apps，即由 MCP 工具返回、在客户端中渲染的交互界面。Codex 核心只把它作为可在运行中刷新的 MCP 开关传递，实际界面由桌面 app 渲染（依据源码推断）。开发中，默认关闭。"
zh_basis = ""

["feature:enable_request_compression"]
en = ""
en_hash = ""
zh_name = "请求体压缩"
zh = "向 Codex 后端发送流式请求时，用 zstd 压缩请求体以减少上传数据量。只在使用 ChatGPT 登录（走 Codex 后端）且模型供应商为内置 OpenAI 时生效。默认开启。"
zh_basis = ""

["feature:exec_permission_approvals"]
en = ""
en_hash = ""
zh_name = "命令申请额外权限"
zh = "允许执行命令的工具在保持沙箱的前提下，为单条命令申请额外权限并交由审批。旧键名 `request_permissions` 仍被接受。开发中，默认关闭。"
zh_basis = ""

["feature:executed_tool_call_metadata"]
en = ""
en_hash = ""
zh_name = "工具调用元数据"
zh = "在发往 Responses API 的内部元数据中记录模型尝试过的工具调用。属于请求层面的内部开关。开发中，默认关闭。"
zh_basis = ""

["feature:executor_capability_discovery"]
en = ""
en_hash = ""
zh_name = "执行端能力发现"
zh = "通过一次高层的 exec-server RPC 发现所选根目录中的插件与技能清单（manifest），代替逐项扫描；文件系统受限的沙箱环境无论是否开启都会使用这种方式。开发中，默认关闭。"
zh_basis = ""

["feature:executor_capability_discovery_v2"]
en = ""
en_hash = ""
zh_name = "执行器能力发现 v2"
zh = "通过 V2 发现协议获取并缓存所选执行环境（执行器）的能力清单，但不发布、也不启用其中的能力；开启后每个轮次开始时，MCP 相关组件会按新清单重新计算。开发中，默认关闭。"
zh_basis = ""

["feature:experimental_windows_sandbox"]
en = ""
en_hash = ""
zh_name = "Windows 沙箱（旧）"
zh = '已移除。曾用于在 Windows 上启用受限令牌沙箱。未设置 `[windows].sandbox` 时，旧配置中的 `true`（以及旧键名 `enable_experimental_windows_sandbox`）仍会被解释为 `sandbox = "unelevated"`；请改用 `[windows].sandbox`。'
zh_basis = ""

["feature:external_agent_memory_import"]
en = ""
en_hash = ""
zh_name = "导入外部代理记忆"
zh = "迁移外部代理配置时，允许从外部编程代理（如 Claude Code）的项目记忆目录导入 Markdown 记忆文件。开发中，默认关闭。"
zh_basis = ""

["feature:external_migration"]
en = ""
en_hash = ""
zh_name = "外部配置迁移提示"
zh = "已移除。曾用于在启动时提示把外部代理的配置迁移到 Codex；现在保留为无效键，设置后被忽略，可改用 `/import` 从 Claude Code 导入。"
zh_basis = ""

["feature:fast_mode"]
en = ""
en_hash = ""
zh_name = "Fast 模式"
zh = '允许使用 Fast 服务档位：配置中的 `service_tier = "fast"`（请求中发送 `priority`）只有开启时才生效，终端界面也会提供切换 Fast 模式的选项和快捷键。关闭后 Fast 档位设置会被忽略；Ultra Fast 档位由 `ultrafast_mode` 单独控制。默认开启。'
zh_basis = ""

["feature:goals"]
en = ""
en_hash = ""
zh_name = "会话目标"
zh = "启用持久保存的会话目标：可用 `/goal` 为长时间任务设定目标，Codex 会在轮次结束后自动继续推进，直到目标完成。默认开启。"
zh_basis = ""

["feature:guardian_approval"]
en = ""
en_hash = ""
zh_name = "自动审查审批"
zh = '启用自动审查（Auto-review，“替我批准”）：审批请求交给自动审查子代理按风险评估后批准或拒绝，而不是询问用户。实际是否启用由 `approvals_reviewer = "auto_review"` 决定，在终端界面打开此开关会同时设置该项；托管配置中的 `auto_review` 也对应此开关。默认开启。'
zh_basis = ""

["feature:guardian_conversation_history_tools"]
en = ""
en_hash = ""
zh_name = "审查读取对话历史"
zh = "让自动审查（Guardian）可以使用根会话的消息历史工具，查阅主对话内容来判断审批请求。开发中，默认关闭。"
zh_basis = ""

["feature:guardian_enhanced_node_repl_transcripts"]
en = ""
en_hash = ""
zh_name = "审查包含 REPL 记录"
zh = "在自动审查（Guardian）的审查材料中加入已完成的 `node_repl` 或 `cua_repl` 代码模式响应文本。开发中，默认关闭。"
zh_basis = ""

["feature:guardian_ext"]
en = ""
en_hash = ""
zh_name = "Guardian 扩展原型"
zh = "已移除。曾用于启用由扩展实现的同步 Guardian 审查器原型；该原型未被采用并已删除，设置后被忽略。"
zh_basis = ""

["feature:guardian_node_repl_transcript_images"]
en = ""
en_hash = ""
zh_name = "审查包含 REPL 图片"
zh = "在自动审查（Guardian）的审查材料中同时加入已完成的 `node_repl` 或 `cua_repl` 代码模式响应里的图片；需要与 `guardian_enhanced_node_repl_transcripts` 一起开启。开发中，默认关闭。"
zh_basis = ""

["feature:guardian_recorded_items"]
en = ""
en_hash = ""
zh_name = "转发 Guardian 审查记录"
zh = "把 Guardian 审查会话内部（通常不对外显示）的条目和中断事件转发给父会话的原始事件观察者，便于客户端记录或展示审查过程。开发中，默认关闭。"
zh_basis = ""

["feature:guardian_reuse_parent_compaction"]
en = ""
en_hash = ""
zh_name = "审查复用父会话压缩"
zh = "重新启动自动审查（Guardian）会话时，复用父会话加密的压缩结果；关闭时，父会话压缩后仍保留一份独立的审查记录。0.156 起为稳定功能并默认开启。"
zh_basis = ""

["feature:guardian_root_handoff_context"]
en = ""
en_hash = ""
zh_name = "审查限定交接上下文"
zh = "多代理 v2 中子代理请求审批时，自动审查只把根会话中此前的沟通窗口作为根会话证据，而不是整段根会话。开发中，默认关闭。"
zh_basis = ""

["feature:guardian_trust_orchestrator_connectors"]
en = ""
en_hash = ""
zh_name = "信任编排器连接器"
zh = "在 Guardian V2 中信任由插件服务编排器（plugin service orchestrator）提供的应用连接器身份，把这类连接器工具视为可信工具。开发中，默认关闭。"
zh_basis = ""

["feature:guardianv2"]
en = ""
en_hash = ""
zh_name = "Guardian V2 自动审查"
zh = "启用第二代 Guardian 自动审批审查（包括异步评分与分类）。可在 `[features.guardianv2]` 下配置审查记录格式、审查范围等细项。开发中，默认关闭。"
zh_basis = ""

["feature:guardianv2.thread_context"]
en = ""
en_hash = ""
zh_name = "Guardian 会话上下文"
zh = "已移除。曾用于让 Guardian V2 使用会话自有的上下文；现在该行为总是开启，`[features.guardianv2]` 中的 `thread_context` 会被忽略并提示删除。"
zh_basis = ""

["feature:guardianv2_decisions_comparison"]
en = ""
en_hash = ""
zh_name = "Decisions 对比测量"
zh = "在 Guardian V2 旁同时运行 Decisions 分类，仅用于对比测量，不改变实际的审批结果。开发中，默认关闭。"
zh_basis = ""

["feature:guardianv3"]
en = ""
en_hash = ""
zh_name = "Guardian V3"
zh = "启用 Guardian V3 相关集成，也可写成 `[features.guardianv3]` 表并用 `enabled` 开启。依据源码推断：0.166.0-alpha.1 中除配置解析外尚无代码读取此开关，开启后暂无可见效果。开发中，默认关闭。"
zh_basis = ""

["feature:hooks"]
en = ""
en_hash = ""
zh_name = "生命周期钩子"
zh = "启用类似 Claude Code 的生命周期钩子：从 `hooks.json` 文件加载钩子，在会话、工具调用等生命周期事件发生时运行，可用 `/hooks` 查看和管理。默认开启；旧键名 `codex_hooks` 仍被接受。"
zh_basis = ""

["feature:image_detail_original"]
en = ""
en_hash = ""
zh_name = "原始分辨率图片"
zh = '已移除。曾允许模型在支持的模型上以 `detail: "original"` 请求原始分辨率图片；现在保留为无效键，只为兼容仍传 `--enable image_detail_original` 的旧脚本。'
zh_basis = ""

["feature:image_generation"]
en = ""
en_hash = ""
zh_name = "图片生成"
zh = "启用由扩展提供的图片生成工具，让模型可以生成图片。需要模型供应商支持图片生成，ChatGPT 免费套餐不可用。默认开启；旧键名 `imagegenext` 仍被接受。"
zh_basis = ""

["feature:image_resize_notice"]
