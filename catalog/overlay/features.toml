zh_basis = ""

["feature:in_app_chat"]
en = ""
en_hash = ""
zh_name = "应用内聊天"
zh = "桌面 app 的管理开关：是否允许使用桌面 app 的内置聊天面板（ChatGPT 对话）。应由管理员在托管配置（requirements）中设置；Codex CLI 本身不读取它。默认开启。"
zh_basis = ""

["feature:in_app_dictation"]
en = ""
en_hash = ""
zh_name = "应用内语音听写"
zh = "桌面 app 的管理开关：是否允许在桌面 app 中使用语音听写输入。应由管理员在托管配置（requirements）中设置；Codex CLI 本身不读取它。默认开启。"
zh_basis = ""

["feature:in_app_local_automation"]
en = ""
en_hash = ""
zh_name = "本地自动化任务"
zh = "桌面 app 的管理开关：是否允许桌面 app 运行本地自动化任务（automations）。应由管理员在托管配置（requirements）中设置；Codex CLI 本身不读取它。默认开启。"
zh_basis = ""

["feature:in_app_updates"]
en = ""
en_hash = ""
zh_name = "应用内更新"
zh = "桌面 app 的管理开关：是否允许桌面 app 在应用内自行更新。应由管理员在托管配置（requirements）中设置；Codex CLI 本身不读取它。默认开启。"
zh_basis = ""

["feature:in_app_voice"]
en = ""
en_hash = ""
zh_name = "应用内语音对话"
zh = "桌面 app 的管理开关：是否允许在桌面 app 中使用语音（Voice）对话；允许并不代表一定可用，还取决于账号和服务端支持。应由管理员在托管配置（requirements）中设置；Codex CLI 本身不读取它。默认开启。"
zh_basis = ""

["feature:incremental_tools"]
en = ""
en_hash = ""
zh_name = "增量工具定义"
zh = "在世界状态中跟踪顶层工具定义，工具变化时只向模型发送增量的上下文更新，而不是整份工具列表。只对使用 Responses Lite 格式的模型生效。0.164 起为稳定功能并默认开启。"
zh_basis = ""

["feature:instant_interrupt"]
en = ""
en_hash = ""
zh_name = "即时打断"
zh = "回复生成过程中用户发送新输入时，立即打断当前响应，并让前台的代码模式观察结果尽快让出，以便马上处理新输入。虽处于开发中，0.162 起的正式版默认开启（桌面 app 自带的 0.162.0-alpha.17.2 中默认关闭）。"
zh_basis = ""

["feature:item_ids"]
en = ""
en_hash = ""
zh_name = "响应条目 ID"
zh = "已移除。曾用于开启响应条目 ID；现在条目 ID 总是开启，保留此键只为兼容旧配置。"
zh_basis = ""

["feature:js_repl"]
en = ""
en_hash = ""
zh_name = "JavaScript REPL"
zh = "已移除。曾提供基于常驻 Node 内核的 JavaScript REPL 工具；该功能已删除，设置后被忽略。"
zh_basis = ""

["feature:js_repl_tools_only"]
en = ""
en_hash = ""
zh_name = "仅 JS REPL 工具"
zh = "已移除。曾用于只向模型直接暴露 `js_repl` 工具；随 JavaScript REPL 一起删除，设置后被忽略。"
zh_basis = ""

["feature:local_thread_store_compression"]
en = ""
en_hash = ""
zh_name = "会话记录压缩"
zh = "压缩本地较冷（不再活跃）的会话记录（rollout 文件），包括共享历史，以节省磁盘空间。要求所有读取同一 Codex 主目录的程序都支持压缩格式；若同一个 `~/.codex` 还会被较旧的 Codex 读取（例如桌面 app 自带的旧版本），不要开启。开发中，默认关闭。"
zh_basis = ""

["feature:local_thread_store_shared_compression"]
en = ""
en_hash = ""
zh_name = "共享历史压缩"
zh = "已移除。原先单独控制共享历史的压缩；现在统一由 `local_thread_store_compression` 控制所有会话记录文件。"
zh_basis = ""

["feature:login_shell_package_path"]
en_name = "Bundled tools in login shells"
en = "Keep bundled tools such as ripgrep available when login shell startup resets PATH."
en_source = "openai/codex rust-v0.161.0: codex-rs/features/src/lib.rs (experimental menu text)"
en_hash = "74a801500fb2d87b"
zh_name = "登录 Shell 保留内置工具"
zh = "登录 Shell 的启动脚本重置了 `PATH` 时，在该 Shell 内重新把 Codex 自带工具（如 ripgrep）所在目录加回 `PATH`，让命令仍能找到它们。只对 POSIX 登录 Shell 且未显式覆盖 `PATH` 时生效。实验性功能，默认关闭。"
zh_basis = "74a801500fb2d87b"

["feature:mcp_2026_07_28"]
en = ""
en_hash = ""
zh_name = "MCP 新协议版本"
zh = "Codex 与 MCP 服务器通信时使用 MCP 协议版本 2026-07-28，关闭时使用旧版协议；内置的 Codex Apps 服务器另由 `codex_apps_mcp_2026_07_28` 控制。开发中，默认关闭。"
zh_basis = ""

["feature:mcp_connection_sharing"]
en = ""
en_hash = ""
zh_name = "共享 MCP 连接"
zh = "自动探测本地 stdio MCP 服务器支持的协议版本，并让多个会话共享符合条件的连接，而不是每个会话各启动一份。`codex_apps` 以及使用运行时凭据或企业托管授权（EMA）的服务器除外。开发中，默认关闭。"
zh_basis = ""

["feature:mcp_oauth_refresh_coordination"]
en = ""
en_hash = ""
zh_name = "MCP OAuth 协调刷新"
zh = "MCP 服务器的 OAuth 令牌改由 MCP 客户端（RMCP）通过 Codex 配置的凭据存储来协调刷新，而不是沿用原有的刷新与保存流程。0.164 起为稳定功能并默认开启。"
zh_basis = ""

["feature:mcp_tool_list_changed"]
en = ""
en_hash = ""
zh_name = "响应 MCP 工具列表变更"
zh = "MCP 服务器发出工具列表变更通知（`notifications/tools/list_changed`）时，在当前轮次内就刷新该服务器提供给模型的工具，而不是一直沿用启动时的列表；开启后也不再复用未跟踪变更的工具目录缓存。开发中，默认关闭。"
zh_basis = ""

["feature:memories"]
en = ""
en_hash = ""
zh_name = "记忆"
zh = "启用记忆：每次启动根会话时，后台调用模型从以往会话中提取记忆，并整理成 Codex 主目录下的记忆文件供之后的会话使用，这会产生额外的模型请求和用量。还需要 `[memories].use_memories` 为 true（默认即是），可用 `/memories` 配置。默认关闭；旧键名 `memory_tool` 仍被接受。"
zh_basis = ""

["feature:mentions_v2"]
en = ""
en_hash = ""
zh_name = "统一提及菜单"
zh = "在终端界面（TUI）中启用统一的提及菜单：输入 `@` 时在同一个列表中选择插件、文件和技能。关闭后 `@` 只搜索文件，插件改回在 `$` 中列出。默认开启。"
zh_basis = ""

["feature:model_catalog_in_context"]
en = ""
en_hash = ""
zh_name = "模型目录写入上下文"
zh = "派生子代理时可选的模型列表改为写入只追加的上下文，而不是放在派生工具的描述里。开发中，默认关闭。"
zh_basis = ""

["feature:multi_agent"]
en = ""
en_hash = ""
zh_name = "子代理"
zh = "启用子代理（协作工具）：模型可以派生子代理并行处理任务、向它们发送消息并等待结果，终端界面中可用 `/agents` 等命令管理。如果模型元数据或 `multi_agent_v2` 指定了多代理版本，以它们为准。默认开启；旧键名 `collab` 仍被接受。"
zh_basis = ""

["feature:multi_agent_mode"]
en = ""
en_hash = ""
zh_name = "多代理模式（旧）"
zh = "已移除。保留为无效键只为兼容旧配置，设置后被忽略；多代理功能由 `multi_agent` 和 `multi_agent_v2` 控制。"
zh_basis = ""

["feature:multi_agent_v2"]
en = ""
en_hash = ""
zh_name = "多代理 v2"
zh = "启用按任务路径（task path）路由的第二代多代理运行时，开启后不论模型如何声明都使用 v2。可在 `[features.multi_agent_v2]` 下配置并发数、等待超时、子代理指令等细项。稳定功能，默认关闭。"
zh_basis = ""

["feature:multi_agent_v2_dynamic_tools"]
en = ""
en_hash = ""
zh_name = "子代理继承动态工具"
zh = "多代理 v2 中新派生的子代理继承客户端定义的动态工具。开发中，默认关闭。"
zh_basis = ""

["feature:multi_env_copy_file"]
en = ""
en_hash = ""
zh_name = "跨环境复制文件"
zh = "向模型提供 `multi_env_copy_file` 工具，在两个不同的执行环境之间按绝对路径复制单个文件，内容不经过模型上下文。两端各按自身权限读写，目标目录必须已存在，中途中断可能留下不完整的文件。开发中，默认关闭。"
zh_basis = ""

["feature:network_proxy"]
en_name = "Network proxy"
en = "Apply network proxy restrictions to sandboxed sessions that already have network access."
en_source = "openai/codex rust-v0.155.0: codex-rs/features/src/lib.rs (experimental menu text)"
en_hash = "e5c09d2c5996c50b"
zh_name = "网络代理"
zh = "为已经拥有网络访问权限的沙箱会话启动受管网络代理，沙箱内命令的网络流量经它转发，并受 `[features.network_proxy]` 中域名允许 / 拒绝等规则的限制。实验性功能，默认关闭；开启后需要重启 Codex。"
zh_basis = "e5c09d2c5996c50b"

["feature:non_prefixed_mcp_tool_names"]
en = ""
en_hash = ""
zh_name = "MCP 工具名去前缀"
zh = "模型看到的 MCP 工具命名空间不再带旧的 `mcp__` 前缀。如果在 `[features.non_prefixed_mcp_tool_names]` 的 `server_names` 中列出服务器，则只有这些服务器去掉前缀。开发中，默认关闭。"
