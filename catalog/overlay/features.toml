# Superba Codex settings catalog: text overlay.
#
# Each table is one catalog entry: `feature:<key>`, `config:<path>` or
# `config:<path>=<value>`. `superba-catalog-gen overlay-sync` maintains the
# generator-owned fields and adds or retires entries:
#   en, en_name  official upstream English, copied verbatim (empty = upstream has none)
#   en_source    where that text comes from (first release with this wording)
#   en_hash      fingerprint of en_name + en
# Maintainers own the other fields (see catalog/CONTRIBUTING.md):
#   zh, zh_name  Chinese name / explanation, written per entry from the codex source
#   zh_basis     the en_hash the Chinese text was written against
#   en_note      English note, only where upstream has no text
# Comments in this file are not preserved; put remarks in the pull request.

format = 1

["feature:agent_message_board"]
en = ""
en_hash = ""
zh_name = "代理留言板"
zh = "为同一代理树中的多个代理提供共享留言板工具（频道、主题帖、发帖、阅读与搜索），供子代理之间交流。仅在同时启用 `multi_agent_v2` 且会话会持久保存时生效；临时会话需另行配置内存或远程留言板。开发中，默认关闭。"
zh_basis = ""

["feature:analytics_plan_history"]
en_name = "Analytics plan history"
en = "Preview five-hour and weekly allowance history for consumer accounts in /analytics."
en_source = "openai/codex rust-v0.156.0: codex-rs/features/src/lib.rs (experimental menu text)"
en_hash = "3a336d58a679179f"
zh_name = "分析页套餐历史"
zh = "在终端界面（TUI）的 `/analytics` 页面中预览 ChatGPT 个人账号的 5 小时额度与每周额度使用历史。实验性功能，默认关闭，只影响 TUI 中的显示。"
zh_basis = "3a336d58a679179f"

["feature:api_key_cyber_access_programs"]
en = ""
en_hash = ""
zh_name = "API key 网络安全计划"
zh = "允许使用 OpenAI API key 登录的会话在请求中携带显式指定的网络安全访问计划（cyber access program，如 Daybreak），是否有权使用仍由服务端判定；关闭时，API key 会话显式指定计划会直接报错。ChatGPT 登录不受此开关影响，且只对内置的 `openai` 模型供应商生效；0.163 起默认开启。"
zh_basis = ""

["feature:api_key_model_discovery"]
en = ""
en_hash = ""
zh_name = "API key 模型发现"
zh = "使用 API key 认证时，从服务端拉取可用模型目录，用于模型选择等处；关闭后不使用拉取到的目录。只对未自定义 base URL 的官方 OpenAI 接口，或配置了 `model_catalog_url` 的模型供应商生效。0.161 起为稳定功能并默认开启。"
zh_basis = ""

["feature:app_server_websocket_compression"]
en = ""
en_hash = ""
zh_name = "app-server 连接压缩"
zh = "让 app-server 的 WebSocket 和 Unix 套接字（UDS）连接与客户端协商使用 zstd 压缩；未开启时不压缩。只影响 app-server 与客户端之间的传输。开发中，默认关闭。"
zh_basis = ""

["feature:apply_patch_freeform"]
