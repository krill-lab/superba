zh = "在 Windows 上，如果系统提供原生 MXC 沙箱且配置允许（`[windows].allow_mxc` 未设为 false），优先使用它，否则沿用原有的 Windows 沙箱。开发中，默认关闭。"
zh_basis = ""

["feature:prevent_idle_sleep"]
en_name = "Prevent sleep while running"
en = "Keep your computer awake while Codex is running a thread."
