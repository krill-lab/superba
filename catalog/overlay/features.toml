zh_basis = ""

["feature:remote_plugin"]
en = ""
en_hash = ""
zh_name = "远程插件目录"
zh = "启用由插件服务（PS）提供的远程插件目录，可以浏览和安装远程插件。默认开启。"
zh_basis = ""

["feature:request_permissions_tool"]
en = ""
en_hash = ""
