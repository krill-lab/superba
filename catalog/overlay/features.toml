en_hash = "f8e5c9637945aeb9"
zh_name = "运行时防止休眠"
zh = "Codex 正在执行轮次时阻止电脑进入空闲休眠，轮次结束后恢复。实验性功能，默认关闭；由终端界面（TUI）实现。"
zh_basis = "f8e5c9637945aeb9"

["feature:psp"]
en = ""
en_hash = ""
zh_name = "PSP 路由"
zh = "为发往 ChatGPT 的第一方请求附加 `oai-chat-psp=true` Cookie，让这些请求经 PSP 路由；PSP 的具体含义源码中没有说明。开发中，默认关闭。"
zh_basis = ""

["feature:realtime_conversation"]
en = ""
en_hash = ""
zh_name = "实时语音对话"
zh = "已移除（0.164 起）。曾用于在终端界面（TUI）中开关实时语音对话（`/voice`）；现在实时语音对话是否可用不再取决于此开关，设置后被忽略。"
zh_basis = ""

["feature:reasoning_effort_override"]
