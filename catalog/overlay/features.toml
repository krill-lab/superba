["feature:nonfatal_clock_read_errors"]
en = ""
en_hash = ""
zh_name = "时钟读取失败不中断"
zh = "读取当前时间失败时（时间提醒、查询时间工具或 sleep 工具），把错误告诉模型，而不是让整个轮次失败。开发中，默认关闭。"
zh_basis = ""

["feature:omit_app_server_notification_media"]
en = ""
en_hash = ""
zh_name = "通知中省略媒体"
zh = "app-server 发给客户端的条目通知中省略内联的图片和音频内容。开发中，默认关闭。"
zh_basis = ""

["feature:output_token_replay"]
en = ""
en_hash = ""
zh_name = "输出 token 重放"
zh = "请求 OpenAI 同时返回加密的采样输出（`output.encrypted_content`），以便之后保留原 token 重放这些输出。只对内置 OpenAI 模型供应商生效。开发中，默认关闭。"
zh_basis = ""

["feature:personality"]
en = ""
en_hash = ""
zh_name = "人格选择"
zh = "已移除。曾用于在终端界面中选择模型人格（personality）；现在保留为无效键，设置后被忽略，托管配置中的该项也会被跳过。"
zh_basis = ""

["feature:plugin_discovery_prefetch"]
en = ""
en_hash = ""
zh_name = "预取插件目录"
zh = "app-server 启动时在后台预先拉取插件目录、精选插件和推荐列表，旧式插件建议读取这份缓存。只使用已安装插件清单的宿主可以关闭它。0.166 起为稳定功能并默认开启。"
zh_basis = ""

["feature:plugin_hooks"]
en = ""
en_hash = ""
zh_name = "插件钩子"
zh = "已移除。曾用于单独启用插件自带的生命周期钩子；现在插件钩子随 `hooks` 与 `plugins` 一起生效，此键设置后被忽略。"
zh_basis = ""

["feature:plugin_sharing"]
en = ""
en_hash = ""
zh_name = "插件共享"
zh = "启用远程插件的共享流程，例如共享插件、查看别人共享给自己的插件。默认开启。"
zh_basis = ""

["feature:plugins"]
en = ""
en_hash = ""
zh_name = "插件"
zh = "启用插件：可浏览、安装和管理插件，插件可以打包技能、MCP 服务器、应用连接器和钩子等，可用 `/plugins` 浏览。关闭后插件及其提供的 MCP 服务器都不会加载。默认开启。"
zh_basis = ""

["feature:powershell_shell_version"]
en = ""
en_hash = ""
zh_name = "PowerShell 版本信息"
zh = "在提供给模型的环境信息中加入所选 PowerShell 执行宿主的主、次版本号。开发中，默认关闭。"
zh_basis = ""

["feature:prediction_preserve_parent_tools"]
en = ""
en_hash = ""
zh_name = "预测分叉保留工具声明"
zh = "app-server 为预测或采样创建的分叉会话禁用 MCP 时，保留从父会话继承的工具声明，并追加一条“本次请求不可用 MCP 工具”的说明，而不是改写工具列表。只对使用 Responses Lite 格式的模型生效。0.166 起为稳定功能并默认开启。"
zh_basis = ""

["feature:prefer_mxc"]
en = ""
en_hash = ""
