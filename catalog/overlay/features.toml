zh = "会话中途切换推理强度时，在请求输入中追加一条可信的配置更新条目，把新的推理强度告知模型。只对内置 OpenAI 模型供应商且模型支持推理强度更新时生效。0.166 起为稳定功能并默认开启。"
zh_basis = ""

["feature:recommended_plugins"]
en = ""
en_hash = ""
zh_name = "推荐插件"
