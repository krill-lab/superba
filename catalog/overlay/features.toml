en = ""
en_hash = ""
zh_name = "执行环境延迟就绪"
zh = "允许在所选执行环境尚未启动完成时就开始轮次，并向模型提供 `wait_for_environment` 工具，用来等待该环境就绪。开发中，默认关闭。"
zh_basis = ""

["feature:deferred_tool_world_state"]
en = ""
en_hash = ""
zh_name = "延迟工具状态说明"
zh = "在模型可见的“世界状态”上下文中列出延迟加载的工具命名空间（例如需要通过工具搜索才会加载的 MCP 工具），工具搜索本身的描述中则不再列出这些来源。开发中，默认关闭。"
zh_basis = ""

