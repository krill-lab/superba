["config:approvals_reviewer"]
en = "Configures who approval requests are routed to for review once they have been escalated. This does not disable separate safety checks such as ARC."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "587bef0aa3a52384"
zh_name = "审批审核者"
zh = "已升级的审批请求（如越出沙箱、被拦截的网络访问、MCP 审批提示）交给谁审核：`user`（默认，由用户决定）或 `auto_review`（由专门的自动审核子代理收集上下文、按风险批准或拒绝）。旧值 `guardian_subagent` 等同于 `auto_review`；ARC 等独立安全检查不受此项影响。"
zh_basis = "587bef0aa3a52384"

["config:auto_review"]
