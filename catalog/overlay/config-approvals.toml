zh = "审批交给 `auto_review` 时，自动审核子代理（Guardian）的策略设置：可以追加或替换审核策略文本、调整读取会话历史的预算和连续拒绝时的熔断方式。"
zh_basis = "4c8ee415f6172107"

["config:auto_review.circuit_break_action"]
en = "Controls whether circuit-breaker interruptions include a structured error. Strict mode writes structured errors that older clients may not recognize when reading shared history. Defaults to `default`."
en_source = "openai/codex rust-v0.159.0: codex-rs/core/config.schema.json"
en_hash = "4d2fb0c493038ae4"
zh_name = "熔断方式"
zh = "同一轮次中自动审核拒绝过多（连续 3 次，或最近 50 次中达到 10 次）而中断该轮次时，是否附带结构化错误：`default`（默认，只发警告并中断）或 `strict`（另附结构化错误）。严格模式写入的错误可能无法被读取共享历史的旧客户端识别。"
zh_basis = "4d2fb0c493038ae4"

["config:auto_review.circuit_break_action=default"]
en = "Emit the warning and interrupt without structured error details."
en_source = "openai/codex rust-v0.159.0: codex-rs/core/config.schema.json"
en_hash = "3f7b69ef729fbd07"
zh_name = "默认"
zh = "发出警告并中断轮次，不附带结构化错误详情。"
zh_basis = "3f7b69ef729fbd07"

["config:auto_review.circuit_break_action=strict"]
en = "Emit the same warning and interruption, with structured error details."
en_source = "openai/codex rust-v0.159.0: codex-rs/core/config.schema.json"
en_hash = "b94602f20cb4ab21"
zh_name = "严格"
zh = "同样发出警告并中断轮次，另外附带结构化错误详情。"
zh_basis = "b94602f20cb4ab21"

