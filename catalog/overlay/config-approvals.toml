# Superba Codex settings catalog: text overlay.
#
# Each table is one catalog entry: `feature:<key>`, `config:<path>` or
# `config:<path>=<value>`. `superba-catalog-gen overlay-sync` maintains the
# generator-owned fields and adds or retires entries:
#   en, en_name  official upstream English, copied verbatim (empty = upstream has none)
#   en_source    where that text comes from (first release with this wording)
#   en_hash      fingerprint of en_name + en
# Maintainers own the other fields (see catalog/CONTRIBUTING.md):
#   zh, zh_name  Chinese name / explanation, written per entry from the codex source
#   zh_basis     the en_hash the Chinese text was written against
#   en_note      English note, only where upstream has no text
# Comments in this file are not preserved; put remarks in the pull request.

format = 1

["config:allow_login_shell"]
en = """
Whether the model may request a login shell for shell-based tools. Default to `true`

If `true`, the model may request a login shell (`login = true`), and omitting `login` defaults to using a login shell. If `false`, the model can never use a login shell: `login = true` requests are rejected, and omitting `login` defaults to a non-login shell."""
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "62a2065c870c3ce3"
zh_name = "允许登录 Shell"
zh = "是否允许 shell 类工具以登录 shell 方式运行命令（会加载 `~/.bash_profile`、`~/.zprofile` 等），默认 `true`，模型未指定时也默认使用登录 shell。设为 `false` 时，模型的 `login = true` 请求会被拒绝，未指定时改用非登录 shell。"
zh_basis = "62a2065c870c3ce3"

["config:approval_policy"]
en = "Default approval policy for executing commands."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "09b203aa33ccf7c5"
zh_name = "审批策略"
zh = "执行命令等操作何时需要用户审批：`on-request`（由模型决定何时请求，旧值 `on-failure` 同义）、`never`（从不请求），或用 `granular` 表按类别控制。未设置时默认 `on-request`，被标记为不受信任的项目改用内部的严格策略；显式写 `untrusted` 已不再支持，会导致配置报错。"
zh_basis = "09b203aa33ccf7c5"

["config:approval_policy.granular"]
en = ""
en_hash = ""
zh_name = "按类别审批"
zh = "按类别控制审批提示的写法（`approval_policy = { granular = { ... } }`）。某项为 `true` 时该类请求照常交给用户审批，为 `false` 时直接自动拒绝、不打扰用户；其中 `sandbox_approval`、`rules`、`mcp_elicitations` 三项必须填写。"
zh_basis = ""

