["config:shell_environment_policy.filters"]
en = """
Pattern actions used by the canonical table representation.

Ordinary config keeps accepting the legacy arrays above during the migration. Requirements will accept only this keyed form, keeping array compatibility isolated so the legacy fields can be deprecated later. Pattern keys merge case-insensitively across config layers, matching how the resulting patterns match environment variable names."""
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "68b85ca1a2acdecb"
zh_name = "变量筛选规则"
zh = "新写法的筛选规则表，键为变量名模式（支持 `*`、`?` 通配，不区分大小写），值为 `include` 或 `exclude`。不能与旧的 `exclude`、`include_only` 混用；`include` 不会加回被 `exclude` 移除的变量。"
zh_basis = "68b85ca1a2acdecb"

["config:shell_environment_policy.filters.<name>"]
en = ""
en_hash = ""
zh_name = "单条筛选规则"
zh = "一条变量筛选规则：键为变量名模式，值为 `include` 时只保留匹配的变量，为 `exclude` 时移除匹配的变量。"
zh_basis = ""

["config:shell_environment_policy.ignore_default_excludes"]
