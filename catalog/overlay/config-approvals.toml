zh_name = "Windows 沙箱实现"
zh = "Windows 上使用的沙箱实现：`elevated`（提升模式，设置时需要管理员权限）、`unelevated`（无需管理员的受限令牌模式）或 `mxc`（系统原生 MXC 沙箱，Codex 0.156 起）。未设置时参考旧的 `[features]` 开关，都没有时 Windows 上不启用沙箱。"
