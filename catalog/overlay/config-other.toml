en_hash = "94a492957a0f4072"
zh_name = "默认启用 Daybreak"
zh = "新会话和非交互轮次（如 `codex exec`）默认是否选用 Daybreak，即 OpenAI 面向网络安全工作的模型访问计划（cyber access program）。默认 `false`；启用后要求使用 `openai` 模型供应商、已登录 ChatGPT 或使用 OpenAI API Key，且所选模型提供 Daybreak，否则会报错；该选项本身不授予访问资格。"
