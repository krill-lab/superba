["config:features.sleep_tool.enabled"]
en = ""
en_hash = ""
zh_name = "启用等待工具"
zh = "是否允许注册内置的 sleep 等待工具（`sleep_tool` 功能，稳定，默认开启）。"
zh_basis = ""

["config:features.sleep_tool.mode"]
en = ""
en_hash = ""
zh_name = "等待工具注册方式"
zh = "`model_driven`（默认）按模型和旧的时钟配置决定是否提供等待工具；`always_on` 始终提供。"
zh_basis = ""

["config:features.sleep_tool.mode=always_on"]
en = "Register sleep regardless of the model or legacy clock configuration."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "4b40f27e3757dc2b"
zh_name = "始终提供"
zh = "无论模型或旧的时钟配置如何，都注册等待工具。"
zh_basis = "4b40f27e3757dc2b"

["config:features.sleep_tool.mode=model_driven"]
en = "Preserve the existing model and legacy clock configuration defaults."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "dd1417de1a936227"
zh_name = "由模型决定"
zh = "保持原有行为：是否提供等待工具由模型目录和旧的时钟配置决定（默认）。"
zh_basis = "dd1417de1a936227"

["config:features.telepathy"]
en = ""
