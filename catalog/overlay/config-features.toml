zh = "允许在沙箱内启动本地服务并直接连接本机回环地址，同时跳过代理额外的内网目标检查；代理的域名规则仍然有效。在 MXC（Windows 原生沙箱）下默认 `true` 且无法强制为 `false`，其他情况默认 `false`。"
