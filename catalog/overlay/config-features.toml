zh = "上下文用量达到模型完整上下文窗口的该百分比时开始后台压缩，默认 65；取值 1–100，即使功能未开启也会校验该范围。"
zh_basis = "ee5e2833bf685d45"

["config:features.code_mode.default_exec_yield_time_ms"]
en = "Default yield timeout for code-mode exec calls, in milliseconds."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
