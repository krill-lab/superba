zh_name = "企业身份提供方"
zh = "企业 IdP 的 OAuth 设置，包含 `issuer` 和 `client_id`。它是共享的企业授权来源，与 Codex 账号凭据相互独立。"
zh_basis = "f26b16a197c72bb3"

["config:mcp_enterprise_managed_auth.idp.client_id"]
