["config:mcp_servers.<name>.tools.<name>.approval_mode"]
en = "Approval mode for this tool."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "fd322b11a5de8d57"
zh_name = "审批模式"
zh = "该工具的审批模式，优先于服务器的 `default_tools_approval_mode`：`auto` 按工具注解判断（标为只读的不询问，可能有破坏性或访问外部的会询问），`prompt` 每次都询问，`writes` 除标为只读的工具外都询问，`approve` 直接批准不询问。"
