["config:mcp_servers.<name>.env_http_headers.<name>"]
en = ""
en_hash = ""
zh_name = "单个环境变量请求头"
zh = "一个请求头：键为请求头名称，值为提供其内容的环境变量名。"
zh_basis = ""

["config:mcp_servers.<name>.env_vars"]
en = ""
en_hash = ""
zh_name = "转发的环境变量"
zh = "从 Codex 自身环境转发给 stdio MCP 服务器的环境变量名列表。每项可以是变量名，也可以是带 `name` 和 `source` 的表，`source` 为 `local`（默认，从本机读取）或 `remote`（在远程执行环境中读取，仅远程 stdio 服务器可用）。"
zh_basis = ""

["config:mcp_servers.<name>.environment_id"]
en = ""
en_hash = ""
zh_name = "运行环境"
zh = "在哪个执行环境中启动该 MCP 服务器，默认 `local`（本机）；其他值表示在对应的远程执行环境中启动。`http_headers_helper` 只支持本机服务器。"
zh_basis = ""

["config:mcp_servers.<name>.http_headers"]
en = ""
en_hash = ""
zh_name = "固定请求头"
zh = "每次请求 HTTP MCP 服务器时附加的固定请求头表；仅 HTTP 服务器可用。密钥类的值建议改用 `env_http_headers` 或 `bearer_token_env_var`。"
zh_basis = ""

["config:mcp_servers.<name>.http_headers.<name>"]
en = ""
en_hash = ""
zh_name = "单个固定请求头"
zh = "一个固定请求头：键为请求头名称，值为请求头内容。"
zh_basis = ""

["config:mcp_servers.<name>.http_headers_helper"]
en = ""
en_hash = ""
zh_name = "动态请求头命令"
zh = "仅本机 HTTP 服务器可用的 shell 命令，运行后应输出一个 JSON 对象作为动态请求头。请求被服务器以 401 或 403 拒绝时会重新运行一次以刷新请求头；命令行可能被本机其他进程看到，不要在其中写入凭据。"
zh_basis = ""

