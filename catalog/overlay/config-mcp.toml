en_source = "openai/codex rust-v0.156.0: codex-rs/core/config.schema.json"
en_hash = "879523309ec7c240"
zh_name = "IdP 客户端 ID"
zh = "在该企业 IdP 中注册的公开 OAuth 客户端 ID，Codex 以此身份向 IdP 发起授权。"
zh_basis = "879523309ec7c240"

["config:mcp_enterprise_managed_auth.idp.issuer"]
en = "Issuer used for enterprise OAuth discovery and identity validation."
en_source = "openai/codex rust-v0.156.0: codex-rs/core/config.schema.json"
en_hash = "8eb87c124e5bdbd7"
zh_name = "IdP 签发方"
zh = "企业 IdP 的 issuer 地址，用于 OAuth 元数据发现和校验身份令牌的签发方。"
