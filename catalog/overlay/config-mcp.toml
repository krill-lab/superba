["config:mcp_oauth_callback_port"]
en = "Optional fixed port for the local HTTP callback server used during MCP OAuth login. When unset, Codex will bind to an ephemeral port chosen by the OS."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "c03af45daa37191e"
zh_name = "MCP 登录回调端口"
zh = "MCP OAuth 登录时本地回调服务器监听的固定端口；未设置时由操作系统随机分配。单个服务器的 `oauth.callback_port` 优先于此项。"
zh_basis = "c03af45daa37191e"

["config:mcp_oauth_callback_url"]
en = "Optional redirect URI to use during MCP OAuth login. When set, this URI is used in the OAuth authorization request instead of the local listener address. The local callback listener still binds to 127.0.0.1 (using `mcp_oauth_callback_port` when provided)."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "503e3fe83df4cdef"
zh_name = "MCP 登录回调地址"
zh = "MCP OAuth 登录时写入授权请求的重定向 URI，用来代替本地监听地址（例如经过端口转发时）。本地回调服务器仍监听 `127.0.0.1`（端口见 `mcp_oauth_callback_port`）；单个服务器的 `oauth.callback_url` 优先于此项。"
zh_basis = "503e3fe83df4cdef"

["config:mcp_oauth_credentials_store"]
en = "Preferred backend for storing MCP OAuth credentials. keyring: Use an OS-specific keyring service. https://github.com/openai/codex/blob/main/codex-rs/rmcp-client/src/oauth.rs#L2 file: Use a file in the Codex home directory. auto (default): Use the OS-specific keyring service if available, otherwise use a file."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "522bd33807d2a424"
zh_name = "MCP 凭据存储位置"
zh = "MCP OAuth 凭据的保存方式：`auto`（默认，优先系统密钥链，不可用时用文件）、`keyring`（只用系统密钥链）或 `file`（保存到 Codex 主目录下的文件）。"
zh_basis = "522bd33807d2a424"

["config:mcp_oauth_credentials_store=auto"]
en = "Prefer `Keyring` and use `File` when keyring storage is unavailable. Once an MCP client loads credentials from one store, that client keeps the resolved store for its lifetime so refreshes cannot switch to a possibly stale credential source. Credentials stored in the keyring will only be readable by Codex unless the user explicitly grants access via OS-level keyring access."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "54d70b72b4e88cd2"
zh_name = "自动选择"
zh = "优先使用系统密钥链，不可用时改用文件。某个 MCP 客户端一旦从某处读到凭据，就在其生命周期内固定使用该存储，避免刷新时切换到可能过期的另一份凭据。密钥链中的凭据默认只有 Codex 能读取，除非用户在系统层面另行授权。"
zh_basis = "54d70b72b4e88cd2"

["config:mcp_oauth_credentials_store=file"]
en = "CODEX_HOME/.credentials.json This file will be readable to Codex and other applications running as the same user."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "f06114f3040ad11a"
zh_name = "本地文件"
zh = "保存到 `CODEX_HOME/.credentials.json`（默认即 `~/.codex/.credentials.json`）。以同一用户身份运行的其他程序也能读取这个文件。"
zh_basis = "f06114f3040ad11a"

["config:mcp_oauth_credentials_store=keyring"]
en = "Keyring when available, otherwise fail."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "c90352a3612a8345"
zh_name = "仅系统密钥链"
zh = "只使用操作系统提供的密钥链服务；密钥链不可用时直接失败，不会退回到文件。"
zh_basis = "c90352a3612a8345"

["config:mcp_optional_startup_grace_ms"]
en = """
Milliseconds to wait for optional MCP servers while building the initial tool catalog.

Defaults to 1000. Set to 0 to disable the shared grace and wait for each server's configured `startup_timeout_sec` instead."""
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "97b3858f7ea36138"
zh_name = "可选 MCP 启动宽限"
zh = "构建初始工具列表时，等待非必需 MCP 服务器启动的毫秒数，默认 `1000`。到时仍未就绪的服务器暂不提供工具；设为 `0` 则不使用共享宽限，改为按各服务器的 `startup_timeout_sec` 等待。"
zh_basis = "97b3858f7ea36138"

["config:mcp_servers"]
en = "Definition for MCP servers that Codex can reach out to for tool calls."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "02ecd2a9fa06a896"
zh_name = "MCP 服务器"
zh = "Codex 可以调用其工具的 MCP 服务器，每个以 `[mcp_servers.<名称>]` 表定义：设置 `command` 时启动本地 stdio 进程，设置 `url` 时连接 Streamable HTTP 服务。"
zh_basis = "02ecd2a9fa06a896"

["config:mcp_servers.<name>"]
en = ""
en_hash = ""
zh_name = "单个 MCP 服务器"
zh = "一个 MCP 服务器的定义，表名即服务器名称。设置 `command` 时为 stdio 服务器，设置 `url` 时为 HTTP 服务器；两类只接受各自的字段，混用会导致配置报错。"
zh_basis = ""

["config:mcp_servers.<name>.args"]
en = ""
en_hash = ""
zh_name = "启动参数"
zh = "启动 stdio MCP 服务器时传给 `command` 的参数列表；仅 stdio 服务器可用。"
zh_basis = ""

["config:mcp_servers.<name>.auth"]
en = ""
en_hash = ""
zh_name = "认证方式"
zh = "HTTP MCP 服务器的认证流程：`oauth`（默认，使用已保存的 OAuth 凭据）、`chatgpt`（对受信任的 ChatGPT 官方来源使用当前 ChatGPT 登录）或 `ema_auth`（企业托管授权）。stdio 服务器不能设置此项。"
zh_basis = ""

["config:mcp_servers.<name>.auth=chatgpt"]
en = "Use the current ChatGPT session for servers on the trusted first-party ChatGPT origin. If no ChatGPT session provider is available, startup can still fall back to stored OAuth credentials."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "ae114f18218e51e8"
zh_name = "使用 ChatGPT 登录"
zh = "对位于受信任的 ChatGPT 官方来源上的服务器，直接使用当前 ChatGPT 会话授权。没有可用的 ChatGPT 会话时，启动仍可退回到已保存的 OAuth 凭据。"
zh_basis = "ae114f18218e51e8"

["config:mcp_servers.<name>.auth=ema_auth"]
en = "Exchange an enterprise IdP refresh token for resource-specific authorization. Alternate credentials and ordinary OAuth fallback are not permitted."
en_source = "openai/codex rust-v0.156.0: codex-rs/core/config.schema.json"
en_hash = "4572145bb844b6bc"
zh_name = "企业托管授权"
zh = "用企业 IdP（见 `mcp_enterprise_managed_auth`）的刷新令牌换取该服务器专用的授权。此模式下不允许使用其他凭据，也不会退回普通 OAuth。"
zh_basis = "4572145bb844b6bc"

["config:mcp_servers.<name>.auth=oauth"]
en = "Use stored MCP OAuth credentials when available. Starting an OAuth login is a separate operation."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "d3ec162519a9cd5b"
zh_name = "OAuth 凭据"
zh = "有已保存的 MCP OAuth 凭据时使用它们（默认）。发起 OAuth 登录是单独的操作，例如运行 `codex mcp login <名称>`。"
zh_basis = "d3ec162519a9cd5b"

