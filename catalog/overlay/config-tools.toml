["config:hooks"]
en = "Lifecycle hooks configured inline in TOML plus user-level overrides."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "e65a54b465ce981a"
zh_name = "生命周期钩子"
zh = "直接写在 `config.toml` 中的钩子：按事件名（如 `PreToolUse`、`Stop`）列出匹配组，在对应时机运行命令（`type` 为 `command`）或调用 MCP 工具（`type` 为 `mcp_tool`）。`hooks.state` 记录每个钩子的启用与信任状态，非托管钩子要经用户确认信任后才会运行。"
zh_basis = "e65a54b465ce981a"

