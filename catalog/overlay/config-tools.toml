["config:web_search"]
en = "Controls the web search tool mode: disabled, cached, indexed, or live."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "22dbb092c006fc76"
zh_name = "联网搜索模式"
zh = "联网搜索工具的模式：`cached`（默认，只用 OpenAI 缓存的结果，不实时访问网页）、`indexed`（只用搜索索引中的结果）、`live`（可实时访问网页）或 `disabled`（关闭）。使用完全访问权限（不使用沙箱）时，除 `disabled` 和 `indexed` 外会优先改用 `live`；当前服务商不支持外部网页访问时，`live` 和 `indexed` 会退回 `cached`。"
zh_basis = "22dbb092c006fc76"
