en_hash = "8843d4fffb051335"
zh_name = "目标 token 预算上限"
zh = "单个目标允许的最大 token 预算，同时作为新建目标的默认预算（正整数）；超过上限的预算会被拒绝。未设置时不限制。"
zh_basis = "8843d4fffb051335"

["config:include_apps_instructions"]
en = "Whether to inject the `<apps_instructions>` developer block."
