# Superba Codex settings catalog: text overlay.
#
# Each table is one catalog entry: `feature:<key>`, `config:<path>` or
# `config:<path>=<value>`. `superba-catalog-gen overlay-sync` maintains the
# generator-owned fields and adds or retires entries:
#   en, en_name  official upstream English, copied verbatim (empty = upstream has none)
#   en_source    where that text comes from (first release with this wording)
#   en_hash      fingerprint of en_name + en
# Maintainers own the other fields (see catalog/CONTRIBUTING.md):
#   zh, zh_name  Chinese name / explanation, written per entry from the codex source
#   zh_basis     the en_hash the Chinese text was written against
#   en_note      English note, only where upstream has no text
# Comments in this file are not preserved; put remarks in the pull request.

format = 1

["config:compact_prompt"]
en = "Compact prompt used for history compaction."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "6b74fb297ac4f8cd"
zh_name = "压缩提示词"
zh = "压缩上下文（生成历史摘要）时发给模型的提示词，替换内置的摘要提示词，优先于 `experimental_compact_prompt_file`。只在本地压缩时使用：内置 `openai` 供应商和 Azure Responses 默认走服务端远程压缩，此时不会用到它。"
zh_basis = "6b74fb297ac4f8cd"

["config:developer_instructions"]
en = "Developer instructions inserted as a `developer` role message."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "c25649f016bd2d8e"
zh_name = "开发者指令"
zh = "以 `developer` 角色消息加入上下文的额外指令。与 `instructions` 不同，它不会替换模型的内置指令。"
zh_basis = "c25649f016bd2d8e"

["config:experimental_compact_prompt_file"]
en = ""
en_hash = ""
zh_name = "压缩提示词文件（实验性）"
zh = "实验性：从该文件读取压缩提示词，文件无法读取或内容为空时配置加载会报错。已设置 `compact_prompt` 时以后者为准；同样只在本地压缩时使用。"
zh_basis = ""

["config:features.context_management.experimental_mode"]
en = "Enables experimental context management."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "9e848f29208bf70b"
zh_name = "实验性上下文管理"
zh = "开发中：开启实验性上下文管理（`context_management` 功能）。仅在 ChatGPT 登录且为 Plus 或 Pro 订阅、使用内置 OpenAI 供应商和支持该能力的模型时生效，生效后会自动启用 `token_budget` 及其历史与笔记扩展。"
zh_basis = "9e848f29208bf70b"

["config:features.token_budget.auto_compact_fallback_buffer_tokens"]
en = "Additional tokens available after the compaction threshold for fallback note-taking."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "312f4f35de21db7a"
zh_name = "兜底缓冲 token 数"
zh = "在自动压缩阈值之后额外预留的 token 数，供模型在压缩前按兜底提示词记笔记。只有设置了 `auto_compact_fallback_prompt` 时才生效，且此时必须填写正整数。"
zh_basis = "312f4f35de21db7a"

["config:features.token_budget.auto_compact_fallback_prompt"]
en = "Developer message sampled before an automatic context-window rollover."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "91ed8d9c0e7512bf"
zh_name = "压缩前兜底提示词"
zh = "上下文窗口即将自动轮换（压缩）前插入的一条开发者消息，让模型先整理要保留的信息。最长 2000 字节，需同时设置 `auto_compact_fallback_buffer_tokens`。"
zh_basis = "91ed8d9c0e7512bf"

["config:features.token_budget.enabled"]
en = ""
en_hash = ""
zh_name = "启用上下文预算"
zh = "开发中：开启 `token_budget` 功能，把当前上下文窗口的用量信息加入模型可见的上下文。本节其他设置只在开启后生效；部分模型的目录信息会自带默认值。"
zh_basis = ""

["config:features.token_budget.guidance_message"]
en = "Guidance appended to the context-window metadata in a developer message."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "7852475da89cee59"
zh_name = "上下文用量说明"
zh = "附加在上下文窗口用量信息之后的说明文字（以开发者消息发送），用来指导模型如何对待剩余预算。最长 2000 字节，留空表示不附加。"
zh_basis = "7852475da89cee59"

["config:features.token_budget.reminder_message_template"]
en = "Reminder template. `{n_remaining}` is replaced with the tokens remaining before auto-compaction."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "0cef2cfe043d398a"
zh_name = "收尾提醒模板"
zh = "收尾提醒的文字模板，其中 `{n_remaining}` 会替换为距离自动压缩还剩的 token 数。不能为空，最长 2000 字节；未设置时使用内置模板。"
zh_basis = "0cef2cfe043d398a"

["config:features.token_budget.reminder_threshold_tokens"]
en = "Number of tokens remaining before auto-compaction when the wrap-up reminder is emitted."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "858ef4f6813f576f"
zh_name = "收尾提醒阈值"
zh = "距离自动压缩还剩多少 token 时向模型发出一次收尾提醒（正整数）。未设置时不发提醒，除非模型目录提供了默认值。"
zh_basis = "858ef4f6813f576f"

["config:features.token_budget.use_history_notes_extension"]
en = "Whether to expose the built-in history and notes extension."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "ec27fef4489b9192"
zh_name = "历史与笔记扩展"
zh = "是否向模型提供内置的历史与笔记扩展：可浏览、搜索压缩前的历史窗口，并读写笔记文件。仅在使用 OpenAI 供应商并通过 Codex 后端认证（ChatGPT 登录）时可用；开启实验性上下文管理时会被自动打开。"
zh_basis = "ec27fef4489b9192"

["config:goals"]
en = "Goal-related settings."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "d4692997e6c9454f"
zh_name = "会话目标"
zh = "`[goals]` 表：会话目标相关设置。目标功能（`features.goals`，默认开启）可以为会话保存目标并自动继续推进。"
zh_basis = "d4692997e6c9454f"

["config:goals.max_goal_token_budget"]
en = "Maximum token budget allowed for a goal and default budget for new goals."
