en_hash = "b256a1d20db9a149"
zh_name = "注入协作模式指令块"
zh = "是否在开发者消息中加入 `<collaboration_mode>` 块，告诉模型当前的协作模式（如 Plan 计划模式或默认模式）及其要求。默认 `true`。"
zh_basis = "b256a1d20db9a149"

["config:include_environment_context"]
en = "Whether to inject the `<environment_context>` user block."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "0a540fa34060f1cd"
zh_name = "注入环境信息块"
zh = "是否以用户消息加入 `<environment_context>` 块，向模型提供工作目录、Shell、日期等运行环境信息。默认 `true`。"
zh_basis = "0a540fa34060f1cd"

["config:include_environment_context_time"]
en = "Whether environment context includes the current date and timezone."
