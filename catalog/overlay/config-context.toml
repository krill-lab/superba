zh_name = "注入应用指令块"
zh = "是否在开发者消息中加入 `<apps_instructions>` 块，向模型说明可用的应用连接器（Apps）。默认 `true`；只有启用了 Apps 且存在可用连接器时才会加入。"
zh_basis = "b8212201246f397e"

["config:include_collaboration_mode_instructions"]
en = "Whether to inject the `<collaboration_mode>` developer block."
