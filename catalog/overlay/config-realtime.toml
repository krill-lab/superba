["config:realtime.version"]
en = ""
en_hash = ""
zh_name = "实时语音协议版本"
zh = "实时语音协议版本：`v1`、`v2`（默认）或 `v3`（无分帧的双向协议，默认模型 `gpt-live-1-codex`）。只对 WebSocket 传输生效；WebRTC 通话未指定版本时用 `v1`，且不支持 `v2`。"
zh_basis = ""

["config:realtime.voice"]
en = ""
en_hash = ""
zh_name = "实时语音音色"
zh = "实时语音回复使用的音色，如 `alloy`、`cedar`、`marin`。每个协议版本只支持其中一部分，选了当前版本不支持的音色会导致语音会话启动失败；不设置时用该版本的默认音色，客户端指定的音色优先。"
