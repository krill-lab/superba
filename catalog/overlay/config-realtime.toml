["config:experimental_realtime_start_instructions"]
en = "Experimental / do not use. Replaces the built-in realtime start instructions inserted into developer messages when realtime becomes active."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "4484797e6f3ad363"
zh_name = "实时语音开始指令（实验）"
zh = "实验性，官方注明请勿使用：替换实时语音开启时插入开发者消息里的内置“开始”指令。客户端为本次会话单独提供的开始指令优先于此项。"
zh_basis = "4484797e6f3ad363"

["config:experimental_realtime_webrtc_call_base_url"]
en = "Experimental / do not use. Overrides only the WebRTC realtime call creation base URL. This is separate from `experimental_realtime_ws_base_url` because WebRTC call creation is HTTP, while sideband control is websocket."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "768bc9b12ac672a6"
zh_name = "WebRTC 通话地址（实验）"
zh = "实验性，官方注明请勿使用：只覆盖创建 WebRTC 实时通话的 HTTP 请求所用的基础 URL。它与 `experimental_realtime_ws_base_url` 分开，因为后者管的是 WebSocket 旁路控制连接；项目内的 `.codex/config.toml` 不能设置此项。"
zh_basis = "768bc9b12ac672a6"

["config:experimental_realtime_ws_backend_prompt"]
en = "Experimental / do not use. Overrides only the realtime conversation websocket transport instructions (the `Op::RealtimeConversation` `/ws` session.update instructions) without changing normal prompts."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "37740e1614ec416b"
zh_name = "实时语音后端提示词（实验）"
zh = "实验性，官方注明请勿使用：替换实时语音 WebSocket 会话 `session.update` 中的指令，不影响普通对话的提示词。非空时优先于客户端传入的提示词和内置提示词。"
zh_basis = "37740e1614ec416b"

["config:experimental_realtime_ws_base_url"]
en = "Experimental / do not use. Overrides only the realtime conversation websocket transport base URL (the `Op::RealtimeConversation` `/v1/realtime` connection) without changing normal provider HTTP requests."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "19af0fc605f8ce64"
zh_name = "实时语音 WebSocket 地址（实验）"
zh = "实验性，官方注明请勿使用：只覆盖实时语音 WebSocket 连接（`/v1/realtime`）的基础 URL，普通模型请求的地址不变；WebRTC 通话的旁路控制连接也使用这个地址。项目内的 `.codex/config.toml` 不能设置此项。"
zh_basis = "19af0fc605f8ce64"

["config:experimental_realtime_ws_model"]
en = "Experimental / do not use. Selects the realtime websocket model/snapshot used for the `Op::RealtimeConversation` connection."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "a4c58c3c29600adf"
zh_name = "实时语音模型（实验）"
zh = "实验性，官方注明请勿使用：指定实时语音 WebSocket 连接使用的模型或快照。客户端请求里指定的模型优先；都未指定时按协议版本取内置默认值（v1/v2 为 `gpt-realtime-1.5`，v3 为 `gpt-live-1-codex`）。"
zh_basis = "a4c58c3c29600adf"

["config:experimental_realtime_ws_startup_context"]
en = "Experimental / do not use. Replaces the synthesized realtime startup context appended to websocket session instructions. An empty string disables startup context injection entirely."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "52c5bc363469f8db"
zh_name = "实时语音启动上下文（实验）"
zh = "实验性，官方注明请勿使用：替换 Codex 自动合成、附加在实时语音会话指令之后的启动上下文。设为空字符串则完全不注入启动上下文。"
zh_basis = "52c5bc363469f8db"

["config:realtime"]
en = "Experimental / do not use. Realtime websocket session selection. `version` controls v1/v2 and `type` controls conversational/transcription."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "a2a3643e3cdc7905"
zh_name = "实时语音会话设置"
zh = "实验性，官方注明请勿使用：选择实时语音会话的协议版本 `version`、会话类型 `type`、传输方式 `transport` 和音色 `voice`。"
zh_basis = "a2a3643e3cdc7905"

