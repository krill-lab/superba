# Superba Codex settings catalog: text overlay.
#
# Each table is one catalog entry: `feature:<key>`, `config:<path>` or
# `config:<path>=<value>`. `superba-catalog-gen overlay-sync` maintains the
# generator-owned fields and adds or retires entries:
#   en, en_name  official upstream English, copied verbatim (empty = upstream has none)
#   en_source    where that text comes from (first release with this wording)
#   en_hash      fingerprint of en_name + en
# Maintainers own the other fields (see catalog/CONTRIBUTING.md):
#   zh, zh_name  Chinese name / explanation, written per entry from the codex source
#   zh_basis     the en_hash the Chinese text was written against
#   en_note      English note, only where upstream has no text
# Comments in this file are not preserved; put remarks in the pull request.

format = 1

["config:analytics"]
en = "When `enabled` is `false`, disables OpenAI analytics across Codex product surfaces on this machine. Custom OTLP metrics exporters are controlled by `otel.metrics_exporter`. When unset, the default depends on the client."
en_source = "openai/codex rust-v0.163.0-alpha.10.2: codex-rs/core/config.schema.json"
en_hash = "dbcd80aeac12f979"
zh_name = "使用统计"
zh = "控制 OpenAI 的使用统计（analytics）：`enabled = false` 时在本机所有 Codex 产品界面关闭。自定义 OTLP 指标导出器不受影响，由 `otel.metrics_exporter` 单独控制；未设置时默认值取决于客户端（终端界面（TUI）和 `codex exec` 默认开启，`codex app-server` 默认关闭，除非以 `--analytics-default-enabled` 启动）。"
zh_basis = "dbcd80aeac12f979"

["config:analytics.enabled"]
en = 'When `false`, disables OpenAI analytics across Codex product surfaces in this profile. Custom OTLP metrics exporters remain enabled; set `otel.metrics_exporter = "none"` to disable them.'
en_source = "openai/codex rust-v0.163.0-alpha.10.2: codex-rs/core/config.schema.json"
en_hash = "c171fd8fa654ad1c"
zh_name = "启用使用统计"
zh = '设为 `false` 时关闭 OpenAI 使用统计，包括发往 ChatGPT 后端的使用事件和内置 `statsig` 通道的指标。自定义 OTLP 指标导出器仍会工作，要一并关闭需设置 `otel.metrics_exporter = "none"`；未设置时按客户端的默认值。'
zh_basis = "c171fd8fa654ad1c"

["config:feedback"]
en = "When `false`, disables feedback collection across Codex product surfaces. Defaults to `true`."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "c47180f0bebe3290"
zh_name = "反馈功能"
zh = "控制各 Codex 产品界面的反馈功能，例如终端界面（TUI）的 `/feedback` 命令和 app-server 的反馈上传。默认开启，`enabled = false` 时关闭。"
zh_basis = "c47180f0bebe3290"

["config:feedback.enabled"]
en = "When `false`, disables the feedback flow across Codex product surfaces."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "30fd5956b603d945"
zh_name = "启用反馈"
zh = "设为 `false` 时关闭反馈流程：终端界面（TUI）的 `/feedback` 只提示已禁用，app-server 拒绝反馈上传请求。默认 `true`。"
zh_basis = "30fd5956b603d945"

["config:otel"]
en = "OTEL configuration."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "6e6bc996518cb2c1"
zh_name = "OpenTelemetry 遥测"
zh = "OpenTelemetry（OTEL）遥测设置：日志、追踪和指标分别由 `exporter`、`trace_exporter`、`metrics_exporter` 决定导出到哪里。默认不导出日志和追踪，指标走内置的 `statsig` 通道（受 `analytics.enabled` 控制）；项目内的 `.codex/config.toml` 不能设置此表。"
zh_basis = "6e6bc996518cb2c1"

["config:otel.environment"]
en = "Mark traces with environment (dev, staging, prod, test). Defaults to dev."
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "c5367b1afc9fb63d"
zh_name = "遥测环境标签"
zh = "写入导出数据的环境标签（如 `dev`、`staging`、`prod`、`test`），用于在收集端区分数据来源。默认 `dev`。"
zh_basis = "c5367b1afc9fb63d"

["config:otel.exporter"]
en = "Optional log exporter"
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "fac88862a425ec43"
zh_name = "日志导出器"
zh = "OTEL 日志事件（如用户提示、工具结果、API 请求）的导出方式：`none`（默认，不导出）、`statsig`（发往 OpenAI 内置的收集端点），或用 `{ otlp-http = { … } }`、`{ otlp-grpc = { … } }` 指向自己的 OTLP 收集器。"
zh_basis = "fac88862a425ec43"

