["config:otel.log_agent_responses"]
en = "Opt in to logging final main-agent and spawned-subagent responses to an OTLP log exporter. Defaults to false. Response text can be sensitive and is capped at 64 KiB."
en_source = "openai/codex rust-v0.158.0: codex-rs/core/config.schema.json"
en_hash = "3d4e6546ef71ad55"
zh_name = "记录代理最终回复"
zh = "是否把主代理和子代理的最终回复文本写入 OTLP 日志。默认 `false`，且只有 `otel.exporter` 设为 `otlp-http` 或 `otlp-grpc` 时才生效；回复可能包含敏感内容，每条最多记录 64 KiB。"
zh_basis = "3d4e6546ef71ad55"

["config:otel.log_guardian_assessments"]
en = "Opt in to logging completed Guardian assessments to an OTLP log exporter. Defaults to false. Rationales can be sensitive and are capped at 64 KiB."
en_source = "openai/codex rust-v0.158.0: codex-rs/core/config.schema.json"
en_hash = "f8bfbe35b29c6daa"
zh_name = "记录 Guardian 评估"
zh = "是否把已完成的 Guardian（自动审批审查）评估写入 OTLP 日志。默认 `false`，且只有 `otel.exporter` 设为 `otlp-http` 或 `otlp-grpc` 时才生效；评估理由可能包含敏感内容，每条最多记录 64 KiB。"
zh_basis = "f8bfbe35b29c6daa"

["config:otel.log_user_prompt"]
en = "Log user prompt in traces"
en_source = "openai/codex rust-v0.155.0: codex-rs/core/config.schema.json"
en_hash = "a7ed9c9e51fa7613"
zh_name = "记录用户提示词"
zh = "是否在 OTEL 日志的 `codex.user_prompt` 事件里记录用户提示词原文。默认 `false`，此时正文以 `[REDACTED]` 代替，只保留长度；追踪数据始终只含长度和输入数量（依据 0.163 源码，官方英文写的是“traces”）。"
zh_basis = "a7ed9c9e51fa7613"

