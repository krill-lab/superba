# [[migration]]: legacy keys whose replacement is a different key and value. Only
# rules verified in upstream code, with the release and function as `source`.
# Aliases (`[features].collab` -> `multi_agent`) and ignored keys come from the
# generated catalog and need no entry here. If both web search flags are true,
# Codex prefers `cached`.

[[migration]]
path = "features.web_search_cached"
canonical = "web_search"
when = true
value = "cached"
source = "openai/codex rust-v0.163.0: codex-rs/core/src/config/mod.rs resolve_web_search_mode"

[[migration]]
path = "features.web_search_request"
canonical = "web_search"
when = true
value = "live"
source = "openai/codex rust-v0.163.0: codex-rs/core/src/config/mod.rs resolve_web_search_mode"

[[migration]]
path = "features.web_search"
canonical = "web_search"
when = true
value = "live"
source = "openai/codex rust-v0.163.0: codex-rs/features/src/legacy.rs (alias of web_search_request) and resolve_web_search_mode"

