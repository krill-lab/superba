# Hand-maintained metadata for the Codex settings catalog.
#
# Upstream sources carry no grouping (the schema is sorted alphabetically) and no
# platform markers, so people maintain both here. The app applies this file at run
# time; changing it does not require regenerating dist/. After editing, run
# `superba-catalog-gen index` (updates dist/index.json) and see CONTRIBUTING.md.
#
# [[category]]: settings categories in display order. `keys` are config path
#   prefixes matched on whole segments (the longest prefix wins); `features` are
#   registry keys shown in this category instead of "features". The UI label is the
#   i18n key `catalog.category.<id>` (crates/superba-catalog/locales); `label` is the
#   English fallback.
# [[platform]]: config paths (prefixes) that only apply on some operating systems.
# [common]: the settings page's "Common" list, in display order (dotted config
#   paths; `features.<key>` for feature toggles). Entries a consumer's Codex does
#   not know are hidden from the list. Keys Superba manages elsewhere (model,
#   speed tiers, provider) do not belong here.

format = 1

[[category]]
id = "model"
label = "Model"
keys = [
    "model",
    "model_catalog_json",
    "model_reasoning_effort",
    "model_reasoning_summary",
    "model_verbosity",
    "oss_provider",
    "personality",
    "plan_mode_reasoning_effort",
